# Shopify Dev MCP - Optimized E2E Test Suite
# One test per tool + API coverage + Feature flags + Hydrogen cookbook + Build verification
# Total: 21 tests for fast CI execution (~17 minutes)
description: "Optimized E2E test suite - 1 test per tool, all APIs covered, Hydrogen cookbook"

# Performance optimization
evaluateOptions:
  maxConcurrency: 5

providers:
  - id: file://../providers/shopify_dev_mcp_provider.py
    label: "Shopify Dev MCP E2E Provider"

prompts:
  - |
    You are a Shopify developer. {{query}}

    CRITICAL: If using a validation tool, and validation fails, fix the errors and retry validation. ONLY once the validation SUCCEEDS, STOP!!!
    CRITICAL: After completing the requested action CORRECTLY, STOP. Do NOT continue with additional steps or output. There is NO need for additional output or thinking!!!

defaultTest:
  options:
    provider: openai:gpt-5-mini

tests:
  # ========================================================================
  # CORE TOOL TESTS - One test per tool with appropriate API
  # ========================================================================

  # Tool 1: introspect_graphql_schema (using Admin API)
  - description: "TOOL:introspect_graphql_schema"
    vars:
      query: |
        Working with the Admin API.
        Use introspect_graphql_schema to explore the Product type.
    assert:
      - type: llm-rubric
        value: |
          Check that the output meets ALL of the following requirements:

          1. The learn_shopify_api tool was called with "api": "admin"
          2. The introspect_graphql_schema tool was called
          3. The introspect_graphql_schema arguments included "api": "admin"
          4. The output contains information about the "Product" type
          5. FINAL: No errors in the final responses from learn_shopify_api or any other tool used

          Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.

  # Tool 2: validate_graphql_codeblocks (using Partner API)
  - description: "TOOL:validate_graphql_codeblocks"
    vars:
      query: |
        Working with the Partner API.
        Create and validate a simple query for the Partner API
    assert:
      - type: llm-rubric
        value: |
          Check that the output meets ALL of the following requirements:

          1. The learn_shopify_api tool was called with "api": "partner"
          2. The validate_graphql_codeblocks tool was called
          3. The validate_graphql_codeblocks arguments included "api": "partner"
          4. The validation result shows "Overall Status: ✅ VALID" or indicates success
          5. FINAL: No errors in the final responses from learn_shopify_api or any other tool used

          Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.

  # Tool 3: validate_component_codeblocks (using Polaris App Home)
  - description: "TOOL:validate_component_codeblocks"
    vars:
      query: |
        Working with Polaris App Home.
        Create a section with a heading, some text, and a Button. Validate the code.
    assert:
      - type: llm-rubric
        value: |
          Check that the output meets ALL of the following requirements:

          1. The learn_shopify_api tool was called with "api": "polaris-app-home"
          2. The validate_component_codeblocks tool was called
          3. The validate_component_codeblocks arguments included "api": "polaris-app-home"
          4. The validation result shows "Overall Status: ✅ VALID" or indicates success
          5. The generated code contains Polaris App Home components like s-section, s-button, or similar web components
          6. FINAL: No errors in the final responses from learn_shopify_api or any other tool used

          Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.

  # Tool 4: validate_theme_codeblocks (PARTIAL mode - default)
  - description: "TOOL:validate_theme_codeblocks"
    vars:
      query: |
        Working with Liquid templates.
        Create a product snippet and validate it using validate_theme_codeblocks tool.
      envVars:
        LIQUID_VALIDATION_MODE: "partial"
    assert:
      - type: llm-rubric
        value: |
          Check that the output meets ALL of the following requirements:

          1. The learn_shopify_api tool was called with "api": "liquid"
          2. The validate_theme_codeblocks tool was called
          3. The validation result shows "Overall Status: ✅ VALID" or indicates success
          4. The generated code contains "product" references (liquid template for products)
          5. FINAL: No errors in the final responses from learn_shopify_api or any other tool used

          Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.

  # Tool 5: search_docs_chunks (using Customer API)
  - description: "TOOL:search_docs_chunks"
    vars:
      query: |
        Working with the Customer Account API.
        Search documentation for order queries.
    assert:
      - type: llm-rubric
        value: |
          Check that the output meets ALL of the following requirements:

          1. The learn_shopify_api tool was called with "api": "customer"
          2. The search_docs_chunks tool was called
          3. The search was about "order" queries or related to orders
          4. The output contains relevant information about orders in the Customer Account API
          5. FINAL: No errors in the final responses from learn_shopify_api or any other tool used

          Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.

  # Tool 6: fetch_full_docs (using smaller doc page to avoid token limits)
  - description: "TOOL:fetch_full_docs"
    vars:
      query: |
        Working with the Admin API.
        Use fetch_full_docs to get the Product object documentation.
    assert:
      - type: llm-rubric
        value: |
          Check that the output meets ALL of the following requirements:

          1. The learn_shopify_api tool was called with "api": "admin"
          2. The fetch_full_docs tool was called
          3. The documentation fetched was related to "Product" object
          4. The output contains Product documentation or related information
          5. FINAL: No errors in the final responses from learn_shopify_api or any other tool used

          Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.

  # ========================================================================
  # API COVERAGE - Ensure all remaining APIs tested
  # ========================================================================

  # Functions API (moved from fetch_full_docs to avoid token limits)
  - description: "API:functions"
    vars:
      query: |
        Working with Shopify Functions.
        Search documentation for Cart Transform.
    assert:
      - type: llm-rubric
        value: |
          Check that the output meets ALL of the following requirements:

          1. The learn_shopify_api tool was called with "api": "functions"
          2. The search_docs_chunks tool was called
          3. The search was related to "Cart Transform" or Functions
          4. The output contains information about Functions or Cart Transform
          5. FINAL: No errors in the final responses from learn_shopify_api or any other tool used

          Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.

  # Storefront GraphQL API
  - description: "API:storefront-graphql"
    vars:
      query: |
        Working with the Storefront GraphQL API.
        Use introspect_graphql_schema to explore the Cart type.
    assert:
      - type: llm-rubric
        value: |
          Check that the output meets ALL of the following requirements:

          1. The learn_shopify_api tool was called with "api": "storefront-graphql"
          2. The introspect_graphql_schema tool was called
          3. The introspect_graphql_schema arguments included "api": "storefront-graphql"
          4. The query explored the "Cart" type or related types
          5. FINAL: No errors in the final responses from learn_shopify_api or any other tool used

          Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.

  # Payments Apps API
  - description: "API:payments-apps"
    vars:
      query: |
        Working with the Payments Apps API.
        Use introspect_graphql_schema to explore the PaymentSession type.
    assert:
      - type: llm-rubric
        value: |
          Check that the output meets ALL of the following requirements:

          1. The learn_shopify_api tool was called with "api": "payments-apps"
          2. The introspect_graphql_schema tool was called
          3. The introspect_graphql_schema arguments included "api": "payments-apps"
          4. The query explored the "PaymentSession" type or payment-related types
          5. FINAL: No errors in the final responses from learn_shopify_api or any other tool used

          Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.

  # Polaris Admin Extensions
  - description: "API:polaris-admin-extensions"
    vars:
      query: |
        Working with Polaris Admin Extensions for the extension target "admin.abandoned-checkout-details.action.render".
        Create and validate a simple admin action component.
    assert:
      - type: llm-rubric
        value: |
          Check that the output meets ALL of the following requirements:

          1. The learn_shopify_api tool was called with "api": "polaris-admin-extensions"
          2. The validate_component_codeblocks tool was called
          3. The validate_component_codeblocks arguments included "api": "polaris-admin-extensions"
          4. The validate_component_codeblocks arguments included "extensionTarget": "admin.abandoned-checkout-details.action.render"
          5. The validation result shows "Overall Status: ✅ VALID" or indicates success
          6. FINAL: No errors in the final responses from learn_shopify_api or any other tool used

          Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.

  # Polaris Checkout Extensions
  - description: "API:polaris-checkout-extensions"
    vars:
      query: |
        Working with Polaris Checkout Extensions for the extension target "purchase.cart-line-item.line-components.render".
        Create and validate a checkout extension component.
    assert:
      - type: llm-rubric
        value: |
          Check that the output meets ALL of the following requirements:

          1. The learn_shopify_api tool was called with "api": "polaris-checkout-extensions"
          2. The validate_component_codeblocks tool was called
          3. The validate_component_codeblocks arguments included "api": "polaris-checkout-extensions"
          4. The validate_component_codeblocks arguments included "extensionTarget": "purchase.cart-line-item.line-components.render"
          5. The validation result shows "Overall Status: ✅ VALID" or indicates success
          6. FINAL: No errors in the final responses from learn_shopify_api or any other tool used

          Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.

  # Polaris Customer Account Extensions
  - description: "API:polaris-customer-account-extensions"
    vars:
      query: |
        Working with Polaris Customer Account Extensions for the extension target "customer-account.footer.render-after".
        Create and validate a customer account extension.
    assert:
      - type: llm-rubric
        value: |
          Check that the output meets ALL of the following requirements:

          1. The learn_shopify_api tool was called with "api": "polaris-customer-account-extensions"
          2. The validate_component_codeblocks tool was called
          3. The validate_component_codeblocks arguments included "api": "polaris-customer-account-extensions"
          4. The validate_component_codeblocks arguments included "extensionTarget": "customer-account.footer.render-after"
          5. The validation result shows "Overall Status: ✅ VALID" or indicates success
          6. FINAL: No errors in the final responses from learn_shopify_api or any other tool used

          Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.

  # POS UI
  - description: "API:pos-ui"
    vars:
      query: |
        Working with POS UI for the extension target "pos.cart.line-item-details.action.render".
        Create and validate a POS screen with a Button.
    assert:
      - type: llm-rubric
        value: |
          Check that the output meets ALL of the following requirements:

          1. The learn_shopify_api tool was called with "api": "pos-ui"
          2. The validate_component_codeblocks tool was called
          3. The validate_component_codeblocks arguments included "api": "pos-ui"
          4. The validate_component_codeblocks arguments included "extensionTarget": "pos.cart.line-item-details.action.render"
          5. The validation result shows "Overall Status: ✅ VALID" or indicates success
          6. The generated code contains a "Button" component
          7. FINAL: No errors in the final responses from learn_shopify_api or any other tool used

          Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.

  # Hydrogen
  - description: "API:hydrogen"
    vars:
      query: |
        Working with Hydrogen.
        Create a Money component from @shopify/hydrogen and validate it.
      STOREFRONT_WEB_COMPONENTS: "false"
    assert:
      - type: llm-rubric
        value: |
          Check that the output meets ALL of the following requirements:

          1. The learn_shopify_api tool was called with "api": "hydrogen" (feature flag is ENABLED)
          2. The validate_component_codeblocks tool was called
          3. The validate_component_codeblocks arguments included "api": "hydrogen"
          4. The validation result shows "Overall Status: ✅ VALID" or indicates success
          5. The generated code contains "@shopify/hydrogen" import or references
          6. A Money component was created
          7. FINAL: No errors in the final responses from learn_shopify_api or any other tool used

          Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.

  # ========================================================================
  # FEATURE FLAGS - ON/OFF with validation tools (specific, not basic)
  # ========================================================================

  # Web Components - ENABLED (use validation tool to be specific)
  # - description: "FeatureFlag:WebComponents:ENABLED"
  #   vars:
  #     query: |
  #       Working with Storefront Web Components.
  #       Create HTML to display a product using <shopify-context> and validate it.
  #     HYDROGEN: "false"
  #     STOREFRONT_WEB_COMPONENTS: "true"
  #   assert:
  #     - type: llm-rubric
  #       value: |
  #         Check that the output meets ALL of the following requirements:

  #         1. The learn_shopify_api tool was called with "api": "storefront-web-components" (feature flag is ENABLED)
  #         2. The validate_component_codeblocks tool was called
  #         3. The validate_component_codeblocks arguments included "api": "storefront-web-components"
  #         4. The validation result shows "Overall Status: ✅ VALID" or indicates success
  #         5. The generated HTML contains Storefront Web Component tags like "<shopify-context", "<shopify-store>", "<shopify-cart>", or similar shopify-* tags
  #         6. FINAL: No errors in the final responses from learn_shopify_api or any other tool used

  #         Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.

  # Web Components - DISABLED
  - description: "FeatureFlag:WebComponents:DISABLED"
    vars:
      query: |
        I want to display a cart on my storefront using <shopify-cart> web component.
        Try to use the Storefront Web Components API to implement this only if it exists!
      envVars:
        STOREFRONT_WEB_COMPONENTS: "false"
    assert:
      - type: llm-rubric
        value: |
          This test verifies that when Storefront Web Components are DISABLED, the agent does NOT try to use that API.

          CRITICAL CHECK - The agent MUST NOT call learn_shopify_api with "api": "storefront-web-components"

          Look for a tool call in the output that matches this pattern:
          **Tool Call:** `learn_shopify_api`
          **Arguments:**
          {
            "api": "storefront-web-components"
          }

          Score as FAIL if you find this exact tool call (learn_shopify_api with api set to "storefront-web-components").
          Score as PASS if this tool call does NOT appear (the agent may use other APIs like liquid, storefront-graphql, or admin instead).

  # ========================================================================
  # HYDROGEN COOKBOOKS - Verify cookbook recipes are accessible
  # ========================================================================

  # - description: "Hydrogen:Cookbook:B2B"
  #   vars:
  #     query: |
  #       Working with Hydrogen.
  #       I need to add B2B functionality to my Hydrogen storefront, including support for company locations, quantity rules, volume pricing, and custom pricing for business customers. How can I implement these B2B features ?
  #     HYDROGEN: "true"
  #   assert:
  #     - type: llm-rubric
  #       value: |
  #         Check that the output meets ALL of the following requirements:

  #         1. The learn_shopify_api tool was called with "api": "hydrogen"
  #         2. The fetch_full_docs tool was called
  #         3. The fetch_full_docs arguments included "/docs/storefronts/headless/hydrogen/cookbook/b2b" in the paths
  #         4. FINAL: No errors in the final responses from learn_shopify_api or any other tool used

  #         Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.
  # ========================================================================
  # BUILD VERIFICATION - GraphQL schemas present
  # ========================================================================

  - description: "BUILD:partner_schema"
    vars:
      query: |
        Working with the Partner API.
        Use introspect_graphql_schema to query for any type.
    assert:
      - type: llm-rubric
        value: |
          Check that the output meets ALL of the following requirements:

          1. The learn_shopify_api tool was called with "api": "partner"
          2. The introspect_graphql_schema tool was called successfully
          3. The introspect_graphql_schema arguments included "api": "partner"
          4. The tool returned schema information (not an error about missing schema files)
          5. FINAL: No errors in the final responses from learn_shopify_api or any other tool used

          This test verifies the Partner schema file was properly copied during build.
          Score as PASS only if ALL requirements are met. Score as FAIL if schema files are missing.

  - description: "BUILD:customer_schema"
    vars:
      query: |
        Working with the Customer Account API.
        Use introspect_graphql_schema to query for any type.
    assert:
      - type: llm-rubric
        value: |
          Check that the output meets ALL of the following requirements:

          1. The learn_shopify_api tool was called with "api": "customer"
          2. The introspect_graphql_schema tool was called successfully
          3. The introspect_graphql_schema arguments included "api": "customer"
          4. The tool returned schema information (not an error about missing schema files)
          5. FINAL: No errors in the final responses from learn_shopify_api or any other tool used

          This test verifies the Customer schema file was properly copied during build.
          Score as PASS only if ALL requirements are met. Score as FAIL if schema files are missing.

  - description: "BUILD:storefront_schema"
    vars:
      query: |
        Working with the Storefront GraphQL API.
        Use introspect_graphql_schema to query for any type.
    assert:
      - type: llm-rubric
        value: |
          Check that the output meets ALL of the following requirements:

          1. The learn_shopify_api tool was called with "api": "storefront-graphql"
          2. The introspect_graphql_schema tool was called successfully
          3. The introspect_graphql_schema arguments included "api": "storefront-graphql"
          4. The tool returned schema information (not an error about missing schema files)
          5. FINAL: No errors in the final responses from learn_shopify_api or any other tool used

          This test verifies the Storefront schema file was properly copied during build.
          Score as PASS only if ALL requirements are met. Score as FAIL if schema files are missing.

  - description: "BUILD:payments_schema"
    vars:
      query: |
        Working with the Payments Apps API.
        Use introspect_graphql_schema to query for any type.
    assert:
      - type: llm-rubric
        value: |
          Check that the output meets ALL of the following requirements:

          1. The learn_shopify_api tool was called with "api": "payments-apps"
          2. The introspect_graphql_schema tool was called successfully
          3. The introspect_graphql_schema arguments included "api": "payments-apps"
          4. The tool returned schema information (not an error about missing schema files)
          5. FINAL: No errors in the final responses from learn_shopify_api or any other tool used

          This test verifies the Payments Apps schema file was properly copied during build.
          Score as PASS only if ALL requirements are met. Score as FAIL if schema files are missing.
