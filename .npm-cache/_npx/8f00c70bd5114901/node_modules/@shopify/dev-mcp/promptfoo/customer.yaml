# Customer Account API Agent Evaluation Configuration
description: Customer Account API Agent

prompts:
  - "I am working with the Shopify Customer Account API. {{ prompt }}"

providers:
  - id: "file://providers/shopify_dev_mcp_provider.py"
    label: "Customer Account API Agent"

defaultTest:
  assert:
    - type: python
      value: file://assertions/multiline_regexp.py
    - type: contains
      value: '→ Called: learn_shopify_api with arguments: {"api":"customer"}'
    - type: python
      value: file://assertions/valid_graphql.py

tests:
  - description: coverage test
    vars:
      prompt: Fetch the current customer's company details
      matches: "```graphql.*company.*```"
  - description: coverage test
    vars:
      prompt: Fetch a company location by ID
      matches: "```graphql.*companyLocation.*```"
  - description: coverage test
    vars:
      prompt: Fetch the authenticated customer's profile
      matches: "```graphql.*customer.*```"
  - description: coverage test
    vars:
      prompt: Fetch a draft order by ID
      matches: "```graphql.*draftOrder.*```"
  - description: coverage test
    vars:
      prompt: Fetch an order by ID
      matches: "```graphql.*order.*```"
  - description: coverage test
    vars:
      prompt: Fetch a return by ID
      matches: "```graphql.*return.*```"
  - description: coverage test
    vars:
      prompt: Fetch the calculated refund amount for a specific return by ID
      matches: "```graphql.*returnCalculate.*```"
  - description: coverage test
    vars:
      prompt: Fetch shop name and primary domain
      matches: "```graphql.*shop.*```"
  - description: coverage test
    vars:
      prompt: Assign a new address to a specific company location
      matches: "```graphql.*companyLocationAssignAddress.*```"
  - description: coverage test
    vars:
      prompt: Add a new shipping address to a customer's account
      matches: "```graphql.*customerAddressCreate.*```"
  - description: coverage test
    vars:
      prompt: Remove a single outdated shipping address from a customer's account
      matches: "```graphql.*customerAddressDelete.*```"
  - description: coverage test
    vars:
      prompt:
        Update a specific customer's shipping address (e.g., change street, city,
        or postal code)
      matches: "```graphql.*customerAddressUpdate.*```"
  - description: coverage test
    vars:
      prompt: Subscribe a customer to email marketing
      matches: "```graphql.*customerEmailMarketingSubscribe.*```"
  - description: coverage test
    vars:
      prompt: Unsubscribe a customer from email marketing
      matches: "```graphql.*customerEmailMarketingUnsubscribe.*```"
  - description: coverage test
    vars:
      prompt: Update a customer's email and marketing preferences
      matches: "```graphql.*customerUpdate.*```"
  - description: coverage test
    vars:
      prompt: Bulk delete multiple obsolete metafields from a customer's account
      matches: "```graphql.*metafieldsDelete.*```"
  - description: coverage test
    vars:
      prompt:
        Atomically set multiple customer metafields (e.g., loyalty_tier and marketing_preferences)
        using compareDigest to prevent concurrent update conflicts
      matches: "```graphql.*metafieldsSet.*```"
  - description: coverage test
    vars:
      prompt: Request a return for selected items from a customer's order on their behalf
      matches: "```graphql.*orderRequestReturn.*```"
  - description: coverage test
    vars:
      prompt: Skip the upcoming billing cycle for a single customer subscription
      matches: "```graphql.*subscriptionBillingCycleSkip.*```"
  - description: coverage test
    vars:
      prompt:
        Unskip a previously skipped upcoming billing cycle for a customer's subscription
        so it will bill and ship as scheduled
      matches: "```graphql.*subscriptionBillingCycleUnskip.*```"
  - description: coverage test
    vars:
      prompt:
        Activate a paused or failed subscription contract to resume upcoming billing
        and fulfillments
      matches: "```graphql.*subscriptionContractActivate.*```"
  - description: coverage test
    vars:
      prompt: Cancel a single subscription contract for a customer
      matches: "```graphql.*subscriptionContractCancel.*```"
  - description: coverage test
    vars:
      prompt: Fetch the available delivery options for a specific subscription contract
      matches: "```graphql.*subscriptionContractFetchDeliveryOptions.*```"
  - description: coverage test
    vars:
      prompt:
        Pause a single customer's subscription contract with a specified resume
        date
      matches: "```graphql.*subscriptionContractPause.*```"
  - description: coverage test
    vars:
      prompt:
        Select the 'standard shipping' option from available delivery options
        to update a subscription contract's delivery method
      matches: "```graphql.*subscriptionContractSelectDeliveryMethod.*```"
