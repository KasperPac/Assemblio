description: Test the liquid MCP functionality - Partial Validation Mode

prompts:
  - I am working with Shopify themes. {{ prompt }}

providers:
  - id: "file://providers/shopify_dev_mcp_provider.py"
    label: "Dev Assistant Agent (Partial Validation)"

defaultTest:
  assert:
    - type: contains-all
      value:
        - '→ Called: learn_shopify_api with arguments: {"api":"liquid"}'
        - "→ Called: validate_theme_codeblocks with arguments:"
    - type: python
      value: file://assertions/valid_liquid.py

tests:
  - ./liquid/golden_tests.yaml
  - ./liquid/liquid_tests.yaml
  - ./liquid/update_tests.yaml
