# Partner API Agent Evaluation Configuration
description: Partner API Agent

prompts:
  - "I am working with the Shopify Partner API. {{ prompt }}"

providers:
  - id: "file://providers/shopify_dev_mcp_provider.py"
    label: "Partner API Agent"

defaultTest:
  assert:
    - type: python
      value: file://assertions/multiline_regexp.py
    - type: contains
      value: '→ Called: learn_shopify_api with arguments: {"api":"partner"}'
    - type: python
      value: file://assertions/valid_graphql.py

tests:
  - description: coverage test
    vars:
      prompt: Fetch an app by ID
      matches: "```graphql.*app.*```"
  - description: coverage test
    vars:
      prompt:
        List all public Partner API versions (supported, release candidate, and
        unstable)
      matches: "```graphql.*publicApiVersions.*```"
  - description: coverage test
    vars:
      prompt: Fetch a transaction by ID
      matches: "```graphql.*transaction.*```"
  - description: coverage test
    vars:
      prompt: Fetch the last 10 transactions
      matches: "```graphql.*transactions.*```"
  - description: coverage test
    vars:
      prompt: Use the appCreditCreate mutation from the Partner API (not Admin API) to create a single app credit for a shop
      matches: "```graphql.*appCreditCreate.*```"
