- description: customer_account_extensions components
  vars:
    prompt: "How can I add a profile thumbnail in the account overview and profile\
      \ pages that shows the customer\u2019s photo when available, and falls back\
      \ to their initials or a generic icon if not, with configurable size and accessible\
      \ labels, using components in my customer account extension?"
    matches: '```.*Avatar.*```'
- description: customer_account_extensions components
  vars:
    prompt: How can I group tracking details, delivery estimates, and quick actions
      like contacting support or reporting an issue into a single, scannable section
      on the order status page of my customer account extension using components?
    matches: '```.*Card.*```'
- description: customer_account_extensions components
  vars:
    prompt: "How can I show a modal after a customer clicks a custom \u201CRequest\
      \ Return\u201D action in the order menu, guiding them through selecting items,\
      \ choosing a return reason, confirming contact details, and then submitting\
      \ the request with loading, validation, error, and success states using components\
      \ in a customer account extension?"
    matches: '```.*CustomerAccountAction.*```'
- description: customer_account_extensions components
  vars:
    prompt: "How can I show a compact gallery of products in my customer account extension\
      \ (for example, wishlist items on the profile page or upcoming subscription\
      \ items on the order status page) that displays up to four images in a grid\
      \ or stacked layout, and automatically shows a \u201C+N more\u201D indicator\
      \ when there are additional items? I\u2019d also like to include accessible\
      \ alt text and make each image clickable to the product page."
    matches: '```.*ImageGroup.*```'
- description: customer_account_extensions components
  vars:
    prompt: "How can I add a \u201CMore actions\u201D button on the order details\
      \ page in my customer account extension that opens a small panel with options\
      \ like \u201CRequest return\u201D (opens a modal), \u201CDownload invoice\u201D\
      \ (triggers an event), and \u201CContact support\u201D (links to an external\
      \ page) using components?"
    matches: '```.*Menu.*```'
- description: customer_account_extensions components
  vars:
    prompt: "How can I set a clear page heading with a subtitle in my customer account\
      \ extension and add top-level actions like \u201CEdit profile,\u201D \u201C\
      Download data,\u201D and a back button, so the layout feels consistent on both\
      \ the profile and order status pages?"
    matches: '```.*Page.*```'
- description: customer_account_extensions components
  vars:
    prompt: "How can I build a list of a customer\u2019s active subscriptions in my\
      \ customer account extension, where each item shows a product thumbnail, title,\
      \ next charge date, a status badge (active/paused), and per-item actions like\
      \ Pause, Skip, or Update payment\u2014matching the order index page style and\
      \ supporting accessible labels, keyboard navigation, and loading/error states?"
    matches: '```.*ResourceItem.*```'
