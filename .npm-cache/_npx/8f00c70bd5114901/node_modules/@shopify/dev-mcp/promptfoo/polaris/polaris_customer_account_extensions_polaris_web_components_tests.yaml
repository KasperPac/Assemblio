- description: polaris_customer_account_extensions polaris web components
  vars:
    prompt: "How can I display a customer\u2019s profile thumbnail on the account\
      \ overview page using Polaris web components, with an image URL when available,\
      \ accessible alt text, a unique id, and automatic initials as a fallback if\
      \ the image is slow or fails to load, while letting me choose the size (small,\
      \ base, large, or the 200 variants) in my customer account extension?"
    matches: (<s\-avatar|(?:root\.)?createComponent\(s\-avatar)
- description: polaris_customer_account_extensions polaris web components
  vars:
    prompt: "On the order details page in my customer account extension, I want to\
      \ show a primary \u201CReorder\u201D action with several secondary actions (like\
      \ \u201CContact support,\u201D \u201CDownload invoice,\u201D and \u201CTrack\
      \ shipment\u201D) that automatically collapse into an overflow when space is\
      \ limited. How can I build this responsive action cluster using Polaris web\
      \ components, and where should I set the accessibility label for the grouped\
      \ actions and a unique id for the element?"
    matches: (<s\-button\-group|(?:root\.)?createComponent\(s\-button\-group)
- description: polaris_customer_account_extensions polaris web components
  vars:
    prompt: How can I open a modal to guide the customer through an order action (for
      example, starting a return) right after they click an order action button, using
      Polaris web components in my customer account extension? I need to set a custom
      heading for the action container and assign a unique id so I can track the interaction.
    matches: (<s\-customer\-account\-action|(?:root\.)?createComponent\(s\-customer\-account\-action)
- description: polaris_customer_account_extensions polaris web components
  vars:
    prompt: "How can I display up to four product images from a customer\u2019s wishlist\
      \ on their account page, and if there are more than four, show a \u201C+X more\u201D\
      \ indicator based on the total count, using Polaris web components in my customer\
      \ account extension? Also, how should I set a unique id for the element and\
      \ provide the totalItems value?"
    matches: (<s\-image\-group|(?:root\.)?createComponent\(s\-image\-group)
- description: polaris_customer_account_extensions polaris web components
  vars:
    prompt: "On the order details page in my customer account extension, how can I\
      \ show a button that opens a popover with actions like \u201CContact support\u201D\
      \ (opens a modal), \u201CTrack shipment\u201D (links out), and \u201CReorder\
      \ items\u201D (triggers an event), and also set a clear accessibilityLabel for\
      \ screen readers and a unique id using Polaris web components?"
    matches: (<s\-menu|(?:root\.)?createComponent\(s\-menu)
- description: polaris_customer_account_extensions polaris web components
  vars:
    prompt: "How can I set up the outer page wrapper on the order history view in\
      \ my customer account extension\u2014adding a main heading, a subheading, and\
      \ a few page-level actions like \u201CDownload invoices\u201D and \u201CUpdate\
      \ address\u201D using Polaris web components\u2014and also assign a unique id\
      \ to this section for tracking?"
    matches: (<s\-page|(?:root\.)?createComponent\(s\-page)
- description: polaris_customer_account_extensions polaris web components
  vars:
    prompt: "In my customer account extension\u2019s order details page, how can I\
      \ group related content like order summary, shipping info, and payment history\
      \ into nested thematic areas that automatically adjust heading levels, while\
      \ setting an accessibility label when there\u2019s no visible heading and assigning\
      \ unique IDs for each area, using Polaris web components?"
    matches: (<s\-section|(?:root\.)?createComponent\(s\-section)
