    prompt: "How can I add a checkout field to collect a customer\u2019s design proof\
      \ URL with built-in URL formatting and validation using polaris web components,\
      \ including setting a default value, controlling autocomplete, enforcing min/max\
      \ length, showing custom error text, assigning a unique id/name, making the\
      \ label screen-reader-only, and optionally disabling the field until a customization\
      \ option is selected?"
    matches: (<s\-url\-field|(?:root\.)?createComponent\(s\-url\-field)
