    prompt: "I want to recommend a complementary email marketing integration to my merchants using app home—how can I design a compact section with the app's logo, brief benefits, rating, and a clear Install or Learn more action that fits naturally into my app's main page?"
    matches: <s-clickable[^>]*>.*<s-grid[^>]*>.*<s-thumbnail[^>]*>.*</s-thumbnail>.*<s-box[^>]*>.*<s-heading>.*</s-heading>.*<s-paragraph>.*</s-paragraph>.*</s-box>.*<s-stack[^>]*>.*<s-button[^>]*>.*</s-button>.*</s-stack>.*</s-grid>.*</s-clickable>
  assert:
    - type: contains
      value: '→ Called: fetch_full_docs with arguments: {"conversationId":'
    - type: contains
      value: '/docs/api/app-home/patterns/compositions/app-card'

