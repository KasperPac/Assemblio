- description: pos extension customer loyalty points display
  vars:
    prompt: Build me a POS extension that shows customer loyalty points on the customer details screen
    matches: (?=.*pos\.customer-details\.block\.render)(?=.*<s-pos-block|<s-section)(?=.*fetch\(['"]shopify:admin/api/graphql\.json['"])

- description: pos extension document preview before printing
  vars:
    prompt: Build a POS extension that lets users preview documents before printing them
    matches: (shopify\.print\.print\()

- description: smart grid extension for cart discount creation
  vars:
    prompt: Build a smart grid extension that allows me to quickly create a discount for the cart
    matches: (pos\.home\.tile\.render|Cart API|applyCartDiscount)

- description: end-of-day checklist for retail store
  vars:
    prompt: Build an end-of-day checklist extension for retail store.
    matches: ((<s-choice-list>.*<s-choice)|<s-button)

- description: extension using all components on single page
  vars:
    prompt: Create POS extension that uses all the components on a single page.
    matches: (?=.*<s-badge)(?=.*<s-banner)(?=.*<s-box)(?=.*<s-button)(?=.*<s-choice-list)(?=.*<s-clickable)(?=.*<s-date-field)(?=.*<s-date-picker)(?=.*<s-date-spinner)(?=.*<s-email-field)(?=.*<s-heading)(?=.*<s-icon)(?=.*<s-image)(?=.*<s-modal)(?=.*<s-number-field)(?=.*<s-page)(?=.*<s-pos-block)(?=.*<s-scroll-box)(?=.*<s-search-field)(?=.*<s-section)(?=.*<s-stack)(?=.*<s-text)(?=.*<s-text-area)(?=.*<s-text-field)(?=.*<s-tile)(?=.*<s-time-field)(?=.*<s-time-picker)

- description: inventory movement between store locations
  vars:
    prompt: Create POS extension that enables inventory movement between store locations. Automatically updates inventory counts at both locations when transfer completes.
    matches: (fetch\(['"]shopify:admin/api/graphql\.json['"])

- description: find product inventory at nearby locations
  vars:
    prompt: Create POS extension to find the same product inventory at nearby store locations.
    matches: (shopify\.productSearch\.|shopify\.product\.|pos\.product-details\.block\.render|fetch\(['"]shopify:admin/api/graphql\.json['"])

- description: smart grid tile for low-stock warnings
  vars:
    prompt: Create a smart-grid tile that warns staff about low-stock products.
    matches: (?=.*pos\.home\.tile\.render)(?=.*fetch\(['"]shopify:admin/api/graphql\.json['"])
