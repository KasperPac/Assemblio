- description: Add proper alt text handling to image snippet
  vars:
    prompt: "Update the image snippet to properly handle alt text. Add an alt parameter that falls back to the image alt if no custom alt is provided. Use the filename specified in the JSON file. {{ liquid_code }}"
    liquid_code: file://liquid_files/image.json
  assert:
    - type: contains-any
      value:
        # Partial mode: Check actual code content
        - "alt:"
        - "image.alt"
        # Check doc preserved
        - '{% raw %}{% doc %}\n  Renders a responsive image that might be wrapped in a link.{% endraw %}'
        # Full mode: Check exact filename was updated
        - "image.liquid"
- description: Change animation on add-to-cart snippet
  vars:
    prompt: "Can you update the animation on this add-to-cart button? Instead of the text sliding up and down, I'd like a horizontal flip effect, like a card turning over. Use the filename specified in the JSON file. Here is the code: {{ liquid_code }}. Here is the default locale file: {{ locale_document }}"
    liquid_code: file://liquid_files/add-to-cart-button.json
    locale_document: file://liquid_files/en.default.json
  assert:
    - type: contains-any
      value:
        # Partial mode: Check actual code content
        - "rotate"
        - "flip"
        # Full mode: Check exact filename was updated
        - "add-to-cart-button.liquid"
- description: Make the logo a clickable link to the homepage
  vars:
    prompt: "Please update this shopify logo component code. I need an option in the theme settings to make the logo a clickable link that takes the user to the homepage. This should be a setting that can be toggled on or off. Use the filenames specified in the JSON files. Here is the code: {{ liquid_code.liquid_code }}. Here is the default locale file: {{ locale_document }}, jumbo-text code: {{ jumbo_text_snippet }}, spacing-style code: {{ spacing_style_snippet }}"
    liquid_code: file://liquid_files/logo.json
    locale_document: file://liquid_files/en.default.json
    jumbo_text_snippet: file://liquid_files/jumbo-text.json
    spacing_style_snippet: file://liquid_files/spacing-style.json
  assert:
    - type: contains-any
      value:
        # Partial mode: Check actual code content
        - 'class="logo-block'
        - '"type": "checkbox"'
        # Full mode: Check exact filenames were updated
        - "logo.liquid"
        - "settings_schema.json"
- description: Adds param and removes unused param on theme validation
  vars:
    prompt: "Can you add a wizard param to this code. it should be a boolean and a check that echoes you are a wizard? Use the filename specified in the JSON file. {{ liquid_code }}"
    liquid_code: file://liquid_files/doc-snippet.json
  assert:
    - type: contains-any
      value:
        # Partial mode: Check actual code content
        - "@param {boolean} wizard"
        # Full mode: Check exact filename was updated
        - "doc-snippet.liquid"
- description: Theme check catches error and LLM fixes it
  vars:
    prompt: "Please check this code for errors and fix them. {{ liquid_code }}"
    liquid_code: file://liquid_files/too_long.json
  assert:
    - type: contains-any
      value:
        # Partial mode: Check name was shortened
        - '"name":'
        # Full mode: Check exact filename was updated
        - "too-long.liquid"
