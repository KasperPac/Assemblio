- description: Section Creation Test 1
  vars:
    prompt: "Create a Shopify theme section for a featured collection display with the following requirements: support for dynamic collection selection, customizable title and description, product grid with 2-6 columns, show/hide product prices and vendor info, and add-to-cart functionality. Ensure it supports app blocks."
- description: Section Creation Test 2
  vars:
    prompt: "Generate a responsive product showcase section with image gallery, product information, customizable colors, layout options (vertical and horizontal), text and typography options for reviews, specifications, and related products."
- description: Section Creation Test 3
  vars:
    prompt: "Build a hero banner section with support for multiple slides, each containing customizable text, buttons, and background images. Include settings for animation effects, auto-play options, and mobile responsiveness."
- description: Section Creation Test 4
  vars:
    prompt: "Create a collection grid section that displays products in a customizable grid layout with filtering options, sorting capabilities, and pagination. Include schema for grid columns, product display options, and styling controls."
- description: Section Creation Test 5
  vars:
    prompt: "Generate a testimonials section with blocks for individual testimonials, including customer photos, ratings, and customizable styling options. Make it support both static content and dynamic metafield integration."

- description: Block Development Test 1
  vars:
    prompt: "Create a theme block for video content that can be used across multiple sections. Include proper schema, settings, and ensure it works with the theme editor's drag-and-drop functionality."
- description: Block Development Test 2
  vars:
    prompt: "Build a product card block with variants for different layouts (grid, list, featured). Include settings for image aspect ratios, content display options, and interactive elements like quick view and add-to-cart."
- description: Block Development Test 3
  vars:
    prompt: "Generate a content block for rich text and media that supports nested blocks for headings, paragraphs, images, videos, and call-to-action buttons. Include responsive design considerations."
- description: Block Development Test 4
  vars:
    prompt: "Create a FAQ accordion block with expandable content areas, customizable styling, and support for structured data markup for SEO benefits."
- description: Block Development Test 5
  vars:
    prompt: "Design a social media feed block that can display Instagram, Twitter, or other social content with customizable layouts and filtering options."

- description: Settings Schema Test 1
  vars:
    prompt: "Generate a comprehensive settings schema for a newsletter signup section including input types for colors, fonts, spacing, layout options, and content management. Include proper validation and default values."
- description: Settings Schema Test 2
  vars:
    prompt: "Create settings schema for a multi-purpose content section with conditional visibility options, where certain settings only appear based on other setting selections."
- description: Settings Schema Test 3
  vars:
    prompt: "Build a color scheme settings group with primary, secondary, and accent colors, including background variants and text color options that automatically calculate contrast ratios."
- description: Settings Schema Test 4
  vars:
    prompt: "Generate typography settings schema with font family pickers, size ranges, weight options, and line height controls for different text elements (headings, body, captions)."
- description: Settings Schema Test 5
  vars:
    prompt: "Create a layout and spacing settings schema with range sliders for margins, padding, and grid gaps, including responsive breakpoint options for my liquid theme."

- description: Snippet Development Test 1
  vars:
    prompt: "Create a reusable Liquid snippet for price display with currency formatting with proper parameter documentation using LiquidDoc format. Include error handling and fallback options."
- description: Snippet Development Test 2
  vars:
    prompt: "Build a product card snippet with multiple layout variants, including compact, expanded, and featured versions. Include proper image handling and responsive design."
- description: Snippet Development Test 3
  vars:
    prompt: "Generate a breadcrumb navigation snippet that works across different page types (product, collection, blog, page) with structured data markup."
- description: Snippet Development Test 4
  vars:
    prompt: "Create a social sharing snippet with customizable platform options, proper Open Graph meta tags, and accessibility features."
- description: Snippet Development Test 5
  vars:
    prompt: "Build a search functionality snippet with autocomplete, filtering options, and result highlighting capabilities."

- description: Template & Layout Test 1
  vars:
    prompt: "Create a product page template using JSON structure with sections for product images, information, recommendations, reviews, and related products. Include proper metafield integration."
- description: Template & Layout Test 2
  vars:
    prompt: "Generate a blog article template with customizable layout options, social sharing, related articles, and comment functionality."
- description: Template & Layout Test 3
  vars:
    prompt: "Build a collection page template with filtering, sorting, and pagination capabilities, plus customizable banner and description areas."
- description: Template & Layout Test 4
  vars:
    prompt: "Create a landing page template structure that supports multiple content sections, customizable layouts, and conversion optimization features."

- description: Advanced Functionality Test 1
  vars:
    prompt: "Implement a multi-step product customization feature with options, variants, and real-time price updates. Include proper cart integration and inventory management."
- description: Advanced Functionality Test 2
  vars:
    prompt: "Create a Liquid-based wishlist section with product cards, remove buttons, and share functionality. Include the section schema for customizing appearance, a snippet for rendering wishlist items with product data (title, price, image, variants), integration with customer metafields for logged-in users to save wishlists, and a fallback message for empty wishlists. The implementation should handle both guest (using form submissions) and logged-in customer scenarios."
- description: Advanced Functionality Test 3
  vars:
    prompt: "Build a size guide feature with modal display, size chart integration, and recommendation engine based on product data and user preferences."
- description: Advanced Functionality Test 4
  vars:
    prompt: "Generate a recently viewed products tracker with local storage, cross-session persistence, and display component for various page types."
- description: Advanced Functionality Test 5
  vars:
    prompt: "Implement a quick shop functionality with product preview, variant selection, and cart addition without page refresh."
