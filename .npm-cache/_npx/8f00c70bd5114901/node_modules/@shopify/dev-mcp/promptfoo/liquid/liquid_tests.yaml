- description: Form Tag
  vars:
    prompt: "Create a shopify component that displays a contact me form."
  assert:
    - type: contains-any
      value:
        - '{% raw %}{% form{% endraw %}'
        - '{% raw %}{%- form{% endraw %}'
- description: Doc Tag & Stylesheet Tag
  vars:
    prompt: "Create a warcraft inspired snippet that shows a product in a quest log"
  assert:
    - type: contains-all
      value:
        - '{% raw %}{% doc %}{% endraw %}'
        - '{% raw %}{% stylesheet %}{% endraw %}'
- description: Filter Test Rejects & Contains
  vars:
    prompt: "Create a shopify component that displays a list of products that doesn't include 'warcraft'."
  assert:
    - type: contains-any
      value:
        - '{% raw %}reject:{% endraw %}'
        - '{% raw %}contains {% endraw %}'
        - '{% raw %}not contains{% endraw %}'
- description: Last Tag
  vars:
    prompt: "Create a shopify component that returns the last product of my collection"
  assert:
    - type: contains
      value: '{% raw %}| last{% endraw %}'

- description: Visible If Condition
  vars:
    prompt: "Create a shopify component for a hero banner where the overlay text color setting only appears when overlay is enabled."
  assert:
    - type: contains
      value: '{% raw %}visible_if{% endraw %}'

- description: Case/When Tags
  vars:
    prompt: "Create a shopify component that displays different icons based on the selected social media platform (facebook, twitter, instagram, youtube)."
  assert:
    - type: contains-all
      value:
        - '{% raw %}{% case{% endraw %}'
        - '{% raw %}{% when{% endraw %}'

- description: Where Filter
  vars:
    prompt: "Create a shopify component that only displays products from the 'featured' collection that are currently available for purchase."
  assert:
    - type: contains
      value: '{% raw %}| where:{% endraw %}'

- description: Tablerow Tag
  vars:
    prompt: "Given a list of product variants, render them inside an HTML <table>. Use a Liquid tag that automates the creation of <tr> rows, ensuring that each row contains exactly 3 <td> cells (one for each variant)."
  assert:
    - type: contains
      value: '{% raw %}{% tablerow{% endraw %}'

- description: Paginate Tag
  vars:
    prompt: "Create a shopify component for a blog that shows 5 articles per page with navigation to view more articles."
  assert:
    - type: contains
      value: '{% raw %}{% paginate{% endraw %}'
- description: Content For Blocks
  vars:
    prompt: "Create the Liquid code for a custom layout file, layout/landing.liquid. This layout file needs to define a unique content area named secondary_header that appears below the main page content. Then, demonstrate how a template file, like templates/page.landing.liquid, would inject a simple <div> into that secondary_header area."
  assert:
    - type: contains
      value: '{% raw %}{% content_for{% endraw %}'
- description: Liquid Block Tag
  vars:
    prompt: "At the top of a product snippet, perform a series of variable assignments before any HTML is rendered. First, assign the product's price to a variable. Second, check if the product has a 'sale' tag and assign the result to a boolean variable. Third, calculate a potential 10% discount from the price. All of this logic should be contained within a single, clean Liquid block."
  assert:
    - type: contains
      value: '{% raw %}{% liquid{% endraw %}'
- description: Date Filter
  vars:
    prompt: "Create a Shopify component for a blog article page. It should find the article's publication date (article.published_at) and display it in the exact format 'Month Day, Year' (e.g., 'July 22, 2025')."
  assert:
    - type: contains
      value: '{% raw %}| date{% endraw %}'
- description: Shopify Attributes
  vars:
    prompt: "In a Shopify component, create the Liquid for a single block of type 'image'. The block should render the image inside a <div> wrapper. Critically, the <div> must include the Liquid attribute necessary for the Shopify Theme Editor to recognize, select, and enable drag-and-drop for that block."
  assert:
    - type: contains
      value: '{% raw %}block.shopify_attributes{% endraw %}'
- description: Static Content
  vars:
    prompt: "Create a Shopify section for an 'FAQ' page. The section must have an editable heading at the top. Below the heading, the merchant must be able to add, reorder, and remove multiple 'Question' blocks. Each block needs a setting for the question and a setting for the answer.To make it easy for merchants to manage their content, the question text from each block should be used as its title in the theme editor's block list."
  assert:
    - type: contains-all
      value:
        - '{% raw %}section.settings.{% endraw %}'
        - '{% raw %}for block in section.blocks{% endraw %}'
    - type: not-contains
      value: '{% raw %}"type": "title"{% endraw %}'
- description: Image Tag (checking for use of non deprecated tag)
  vars:
    prompt: "Create a Shopify component that displays a product image resized to 400x400 pixels with a 1:1 aspect ratio for consistent display in a product grid."
  assert:
    - type: contains-any
      value:
        - '{% raw %}image_tag{% endraw %}'
        - '{% raw %}image_url{% endraw %}'
    - type: not-contains
      value: '{% raw %}img_tag{% endraw %}'
- description: OKLCH filter (checking for use of newer filter)
  vars:
    prompt: "Create a Shopify component that takes CSS color strings (like '#ff5733', 'rgb(255, 87, 51)', or 'hsl(12, 100%, 60%)') from theme settings and converts them to OKLCH format for more advanced color manipulation. The component should then display these colors in a color palette section where merchants can see the converted OKLCH values."
  assert:
    - type: contains-any
      value:
        - '{% raw %}color_to_oklch{% endraw %}'
        - '{% raw %}.oklch{% endraw %}'
        - '{% raw %}.chroma{% endraw %}'
        - '{% raw %}.color_space{% endraw %}'
