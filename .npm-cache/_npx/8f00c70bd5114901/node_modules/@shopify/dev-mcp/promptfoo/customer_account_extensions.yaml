description: Customer Account Extensions API evals for an agent with access to the dev-mcp MCP server

prompts:
  - "Customer Account Extensions: {{ prompt }}."

providers:
  - id: "file://providers/shopify_dev_mcp_provider.py"
    label: "Dev Assistant Agent"

defaultTest:
  assert:
    - type: contains
      value: '→ Called: learn_shopify_api with arguments: {"api":"polaris-customer-account-extensions"}'
    - type: python
      value: file://assertions/multiline_regexp.py
    - type: python
      value: file://assertions/valid_components.py

tests:
  - ./polaris/polaris_customer_account_extensions_polaris_web_components_tests.yaml
