description: Admin API evals for an agent with access to the dev-mcp MCP server

prompts:
  - "I am working with the Shopify Admin API. {{ prompt }}"

providers:
  - id: "file://providers/shopify_dev_mcp_provider.py"
    label: "Dev Assistant Agent"

defaultTest:
  assert:
    - type: python
      value: file://assertions/multiline_regexp.py
    - type: python
      value: file://assertions/valid_graphql.py
    - type: contains
      value: '→ Called: learn_shopify_api with arguments: {"api":"admin"}'

tests:
  - ./admin/coverage_tests.yaml
  - ./admin/rest_tests.yaml
