description: Admin API golden tests for an agent with access to the dev-mcp MCP server

prompts:
  - "I am working with the Shopify Admin API. {{ prompt }}"

providers:
  - id: "file://providers/shopify_dev_mcp_provider.py"
    label: "Dev Assistant Agent"

defaultTest:
  assert:
    - type: python
      value: file://assertions/multiline_regexp.py
    - type: contains
      value: '→ Called: learn_shopify_api with arguments: {"api":"admin"}'

tests:
  - description: golden test
    vars:
      prompt: Create a draft order with a custom price
      matches: "draftOrderCreate.*lineItems.*originalUnitPrice"
    assert:
      - type: python
        value: file://assertions/valid_graphql.py
  - description: golden test
    vars:
      prompt: Fetch all the products tagged 'tee' and create a basic code discount for them returning the id
      matches: "products.*query.*tag:tee.*discountCodeBasicCreate"
    assert:
      - type: python
        value: file://assertions/valid_graphql.py
  - description: golden test
    vars:
      prompt: Fetch last 3 products and tag them with "new"
      matches: "products.*(tagsAdd|productSet|productUpdate).*tags"
    assert:
      - type: python
        value: file://assertions/valid_graphql.py
  - description: golden test
    vars:
      prompt: Fetch product descriptions for all products on my store with pagination
      matches: "products.*pageInfo.*hasNextPage"
    assert:
      - type: python
        value: file://assertions/valid_graphql.py
  - description: golden test
    vars:
      prompt: Fetch the first 10 products, and order them by price
    assert:
      - type: llm-rubric
        value: |
          The response should:
          1. Generate a GraphQL query that fetches products WITHOUT attempting to use PRICE as a sortKey parameter
          2. Explain that the Admin API doesn't support server-side sorting by price
          3. Provide a solution for client-side sorting of products by price
  - description: golden test
    vars:
      prompt: Get me a list of all try before you buy product ID's
      matches: "products.*(tag|category).*try"
    assert:
      - type: python
        value: file://assertions/valid_graphql.py
  - description: golden test
    vars:
      prompt: Get the 3 most recently created products with prices over $1000
      matches: "products.*query:.*price:>1000"
    assert:
      - type: python
        value: file://assertions/valid_graphql.py
  - description: golden test
    vars:
      prompt: Get the 3 oldest products
      matches: "products.*sortKey: CREATED_AT"
    assert:
      - type: python
        value: file://assertions/valid_graphql.py
  - description: golden test
    vars:
      prompt: Get the image URL for products
      matches: "products.*image.*(url|originalSrc)"
    assert:
      - type: python
        value: file://assertions/valid_graphql.py
  - description: golden test
    vars:
      prompt: Get the name of customers with ids 123, 321, 132
      matches: "(customer\\(.*customer\\(.*customer\\(|nodes.*ids.*gid://shopify/Customer/123)"
    assert:
      - type: python
        value: file://assertions/valid_graphql.py
  - description: golden test
    vars:
      prompt: I want to add a new product and make it available on Shop app channel
      matches: "productCreate.*publishablePublish"
    assert:
      - type: python
        value: file://assertions/valid_graphql.py
  - description: golden test
    vars:
      prompt: I want to delete a customer
      matches: "customerDelete"
    assert:
      - type: python
        value: file://assertions/valid_graphql.py
  - description: golden test
    vars:
      prompt: List of device types accessing my store
    assert:
      - type: llm-rubric
        value: "The Shopify GraphQL API does not directly expose device type information"
  - description: golden test
    vars:
      prompt: List of code discounts active in my store
      matches: "codeDiscountNodes.*DiscountCodeBasic.*DiscountCodeBxgy"
    assert:
      - type: python
        value: file://assertions/valid_graphql.py
  - description: golden test
    vars:
      prompt: List of products that do not have the title 'tee'
    assert:
      - type: llm-rubric
        value: |
          The response should:
          1. Generate a GraphQL query that uses the products field with a query parameter
          2. Use Shopify's search syntax to EXCLUDE products with 'tee' in the title
          3. The exclusion should use either:
            - The minus prefix syntax: -title:"tee" or -title:tee
            - The NOT keyword syntax: NOT title:"tee" or NOT title:tee
      - type: python
        value: file://assertions/valid_graphql.py
  - description: golden test
    vars:
      prompt: List all enabled locales and supported locales in my store
      matches: "shopLocales.*availableLocales"
    assert:
      - type: python
        value: file://assertions/valid_graphql.py
  - description: golden test
    vars:
      prompt: "I need a product, its main image, and 3 metafields: reviews.a, reviews.b, reviews.c"
    assert:
      - type: llm-rubric
        value: |
          The response should:
          1. Generate a GraphQL query that fetches a single product
          2. Include the product's main/featured image (using featuredImage field)
          3. Retrieve the 3 specific metafields from the "reviews" namespace with keys "a", "b", and "c"
          4. Use one of these valid approaches for metafields:
            - Individual metafield queries with aliases (e.g., reviewsA: metafield(namespace: "reviews", key: "a"))
            - The metafields field with keys parameter (e.g., metafields(namespace: "reviews", keys: ["a", "b", "c"]))
      - type: python
        value: file://assertions/valid_graphql.py
  - description: golden test
    vars:
      prompt: 'I would like to query all product with titles that end with "t", here is my query string : "title:*t", what is wrong?'
    assert:
      - type: llm-rubric
        value: "The question cannot be solved with the query parameter provided by the API"
  - description: golden test
    vars:
      prompt: 'I would like to query all products with titles that start with "t"'
    assert:
      - type: contains
        value: 'query: "title:t*"'
      - type: python
        value: file://assertions/valid_graphql.py
  - description: golden test
    vars:
      prompt: "What are the highlights of admin API changes for version 2024-10"
    assert:
      - type: contains
        value: AbandonedCheckout
  - description: golden test
    vars:
      prompt: "Get the last 10 products"
    assert:
      - type: regex
        value: "/docs/api/admin-graphql/\\d{4}-\\d{2}/queries/products"
      - type: python
        value: file://assertions/valid_graphql.py
  - description: golden test
    vars:
      prompt: "What are all the access scopes related to orders?"
    assert:
      - type: contains-all
        value:
          - "/docs/api/usage/access-scopes"
          - "read_orders"
          - "read_marketplace_orders"
          - "write_orders"
          - "write_marketplace_orders"
          - "read_all_orders"
