description: Hydrogen API evals for an agent with access to the dev-mcp MCP server

prompts:
  - "Hydrogen: {{ prompt }}."

providers:
  - id: "file://providers/shopify_dev_mcp_provider.py"
    label: "Dev Assistant Agent"

defaultTest:
  assert:
    - type: contains
      value: '→ Called: learn_shopify_api with arguments: {"api":"hydrogen"}'
    - type: python
      value: file://assertions/multiline_regexp.py
    - type: python
      value: file://assertions/valid_components.py

tests:
  - description: hydrogen components
    vars:
      prompt:
        How can I trigger a cart_viewed analytics event when a customer opens
        the cart page or cart drawer, and include details like cartId, line items, quantities,
        total price, currency, and UTM/session data, using Shopify Hydrogen components
        in my storefront?
      matches: (<Analytics\.CartView|(?:root\.)?createComponent\(Analytics\.CartView)
  - description: hydrogen components
    vars:
      prompt:
        How can I publish a collection_viewed analytics event when a shopper views
        a collection page, including details like the collection handle, title, and
        product count, using Shopify Hydrogen components in my storefront?
      matches: (<Analytics\.CollectionView|(?:root\.)?createComponent\(Analytics\.CollectionView)
  - description: hydrogen components
    vars:
      prompt:
        How can I publish a custom page view analytics event (for example, custom_product_view)
        using Shopify Hydrogen components in my storefront?
      matches: (<Analytics\.CustomView|(?:root\.)?createComponent\(Analytics\.CustomView)
  - description: hydrogen components
    vars:
      prompt:
        "How can I track page views and cart interactions, respect customer consent,\
        \ and wire up a third\u2011party analytics service via a publish/subscribe pattern\
        \ (including listening for the shopifyCustomerPrivacyApiLoaded event) using\
        \ Shopify Hydrogen components in my storefront?"
      matches: (<Analytics\.Provider|(?:root\.)?createComponent\(Analytics\.Provider)
  - description: hydrogen components
    vars:
      prompt:
        How can I publish a product_viewed analytics event when a shopper lands
        on a product page (and update it when they switch variants) using Shopify Hydrogen
        components, including sending the product and variant IDs, title, price, currency,
        and any custom attributes?
      matches: (<Analytics\.ProductView|(?:root\.)?createComponent\(Analytics\.ProductView)
  - description: hydrogen components
    vars:
      prompt:
        How can I fire a search_viewed analytics event when a shopper lands on
        the search results page, including the search term and total results, using
        Shopify Hydrogen components in my storefront?
      matches: (<Analytics\.SearchView|(?:root\.)?createComponent\(Analytics\.SearchView)
  - description: hydrogen components
    vars:
      prompt:
        How can I create a custom cart form in my storefront that lets customers
        update quantities, remove items, apply discount codes, and add a gift message,
        while validating and mapping inputs to known types with CartActionInput using
        Shopify Hydrogen components?
      matches: (<CartForm|(?:root\.)?createComponent\(CartForm)
  - description: hydrogen components
    vars:
      prompt:
        How can I integrate a third-party chat widget in my Hydrogen storefront,
        ensure it automatically gets the CSP nonce, and load it only after hydration
        to avoid DOM-related hydration errors, using Shopify Hydrogen components?
      matches: (<Scripts|(?:root\.)?createComponent\(Scripts)
  - description: hydrogen components
    vars:
      prompt:
        "How can I add a custom \u201Cgift note\u201D text input to my cart that\
        \ updates instantly with optimistic feedback while the save request is processing,\
        \ using Shopify Hydrogen components?"
      matches: (<OptimisticInput|(?:root\.)?createComponent\(OptimisticInput)
  - description: hydrogen components
    vars:
      prompt:
        "How can I implement cursor-based pagination for a collection grid that\
        \ appends more products on \u201CLoad more,\u201D keeps the current page and\
        \ scroll position in the URL so users can navigate into a product and back without\
        \ losing their place, and makes the list state shareable via link, using Shopify\
        \ Hydrogen components?"
      matches: (<Pagination|(?:root\.)?createComponent\(Pagination)
  - description: hydrogen components
    vars:
      prompt:
        How can I build a product page variant picker that syncs selected options
        (like size and color) to the URL so the exact variant is shareable and restored
        on navigation, while rendering each product option as interactive inputs, using
        Shopify Hydrogen components?
      matches: (<VariantSelector|(?:root\.)?createComponent\(VariantSelector)
  - description: hydrogen components
    vars:
      prompt:
        "How can I add SEO meta tags in my Hydrogen storefront by rendering them\
        \ in the document head from root.jsx (before Remix\u2019s Meta and Link), set\
        \ page-specific metadata via loader functions, and migrate to getSeoMeta now\
        \ that the old approach is deprecated, using Shopify Hydrogen components?"
      matches: (<Seo|(?:root\.)?createComponent\(Seo)
  - description: hydrogen components
    vars:
      prompt:
        How can I render product images from the Storefront API in my storefront,
        make them responsive with an aspect ratio to avoid layout shift, and for fixed-size
        thumbnails set a width that auto-generates 1x/2x/3x srcset, using Shopify Hydrogen
        components?
      matches: (<Image|(?:root\.)?createComponent\(Image)
  - description: hydrogen components
    vars:
      prompt:
        "How can I embed a product\u2019s external video (e.g., YouTube or Vimeo)\
        \ from the Storefront API on a product page with a responsive layout, a preview\
        \ image, alt text, and lazy loading using Shopify Hydrogen components in my\
        \ storefront?"
      matches: (<ExternalVideo|(?:root\.)?createComponent\(ExternalVideo)
  - description: hydrogen components
    vars:
      prompt:
        "How can I build a product gallery that pulls a product\u2019s Media objects\
        \ from the Storefront API and automatically renders images, videos, external\
        \ videos, and 3D models with responsive sizing, lazy loading, alt text, and\
        \ appropriate controls/fallbacks, using Shopify Hydrogen components?"
      matches: (<MediaFile|(?:root\.)?createComponent\(MediaFile)
  - description: hydrogen components
    vars:
      prompt:
        How can I render localized product prices from the Storefront API MoneyV2
        data, respect the locale configured in ShopifyProvider, and add custom classes
        or data attributes to the output element using Shopify Hydrogen components in
        my storefront?
      matches: (<Money|(?:root\.)?createComponent\(Money)
  - description: hydrogen components
    vars:
      prompt:
        "How can I add an interactive 3D viewer to my product page that loads\
        \ a product\u2019s Model3d from the Storefront API, supports lazy loading, AR\
        \ (Quick Look/Scene Viewer), auto-rotate, camera controls, and a poster image\
        \ fallback using Shopify Hydrogen components?"
      matches: (<ModelViewer|(?:root\.)?createComponent\(ModelViewer)
  - description: hydrogen components
    vars:
      prompt:
        How can I add a button that redirects customers to Shop Pay checkout and
        conditionally show it only for eligible products using Shopify Hydrogen components
        in my storefront?
      matches: (<ShopPayButton|(?:root\.)?createComponent\(ShopPayButton)
  - description: hydrogen components
    vars:
      prompt:
        "How can I display a product\u2019s rich text metafield on the product\
        \ page and override how specific nodes render (for example, turning H1s into\
        \ H2s, adding custom classes to paragraphs, and making links open in a new tab)\
        \ using Shopify Hydrogen components in my storefront?"
      matches: (<RichText|(?:root\.)?createComponent\(RichText)
  - description: hydrogen components
    vars:
      prompt:
        "How can I display a product\u2019s media video from the Storefront API\
        \ on the product page using Shopify Hydrogen components, and customize playback\
        \ (autoplay, loop, muted, playsinline), set a poster image, and apply responsive\
        \ styling?"
      matches: (<Video|(?:root\.)?createComponent\(Video)
