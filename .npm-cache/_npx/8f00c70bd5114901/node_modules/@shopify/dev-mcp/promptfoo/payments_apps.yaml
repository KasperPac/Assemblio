# Payments Apps API Agent Evaluation Configuration
description: Payments Apps API Agent

prompts:
  - "I am working with the Shopify Payments Apps API. {{ prompt }}"

providers:
  - id: "file://providers/shopify_dev_mcp_provider.py"
    label: "Payments Apps API Agent"

defaultTest:
  assert:
    - type: python
      value: file://assertions/multiline_regexp.py
    - type: contains
      value: '→ Called: learn_shopify_api with arguments: {"api":"payments-apps"}'
    - type: python
      value: file://assertions/valid_graphql.py

tests:
  - description: coverage test
    vars:
      prompt: List all public Payments Apps API versions
      matches: "```graphql.*publicApiVersions.*```"
  - description: coverage test
    vars:
      prompt: Reject an open capture session and block future resolve attempts
      matches: "```graphql.*captureSessionReject.*```"
  - description: coverage test
    vars:
      prompt:
        Resolve a single open capture session to finalize funds capture for a
        specific payment authorization
      matches: "```graphql.*captureSessionResolve.*```"
  - description: coverage test
    vars:
      prompt:
        Initiate payment confirmation for a single payment session to attempt
        authorization
      matches: "```graphql.*paymentSessionConfirm.*```"
  - description: coverage test
    vars:
      prompt:
        Trigger a post-checkout modal to display a personalized offer to the buyer
        populated by your UI extension
      matches: "```graphql.*paymentSessionModal.*```"
  - description: coverage test
    vars:
      prompt:
        Mark a single payment session as pending and redirect the customer back
        to Shopify using the provided redirect URL
      matches: "```graphql.*paymentSessionPending.*```"
  - description: coverage test
    vars:
      prompt:
        Redirect a buyer to an external authentication URL (e.g., 3D Secure) for
        a payment session
      matches: "```graphql.*paymentSessionRedirect.*```"
  - description: coverage test
    vars:
      prompt:
        Reject a single open payment session by providing a rejection reason,
        preventing any future resolution attempts
      matches: "```graphql.*paymentSessionReject.*```"
  - description: coverage test
    vars:
      prompt:
        "Resolve an open payment session after successfully authorizing the customer\u2019\
        s payment"
      matches: "```graphql.*paymentSessionResolve.*```"
  - description: coverage test
    vars:
      prompt: Configure a partner-managed payments gateway for a merchant's store
      matches: "```graphql.*paymentsAppConfigure.*```"
  - description: coverage test
    vars:
      prompt: Reject an open refund session with a specified rejection reason
      matches: "```graphql.*refundSessionReject.*```"
  - description: coverage test
    vars:
      prompt: Resolve a single open refund session to finalize the refund decision.
      matches: "```graphql.*refundSessionResolve.*```"
  - description: coverage test
    vars:
      prompt:
        Redirect the buyer to the 3D Secure authentication URL for a credit card
        verification session
      matches: "```graphql.*verificationSessionRedirect.*```"
  - description: coverage test
    vars:
      prompt:
        Reject an open verification session and record a rejection reason, preventing
        any future resolution attempts
      matches: "```graphql.*verificationSessionReject.*```"
  - description: coverage test
    vars:
      prompt:
        "Resolve a pending verification session after successful review to complete\
        \ a single merchant\u2019s payouts onboarding"
      matches: "```graphql.*verificationSessionResolve.*```"
  - description: coverage test
    vars:
      prompt: Reject a single open void session and provide a specified rejection reason
      matches: "```graphql.*voidSessionReject.*```"
  - description: coverage test
    vars:
      prompt: Resolve an open void session to confirm voiding a single payment authorization
      matches: "```graphql.*voidSessionResolve.*```"
