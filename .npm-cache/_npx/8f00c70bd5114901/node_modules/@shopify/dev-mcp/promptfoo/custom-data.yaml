description: "Custom Data evals"

prompts:
  - "I want to work with custom data. {{ prompt }}"

providers:
  - id: "file://providers/shopify_dev_mcp_provider.py"
    label: "Dev Assistant Agent"

defaultTest:
  assert:
    - type: contains
      value: '→ Called: learn_shopify_api with arguments: {"api":"custom-data"}'

tests:
  - description: "Create a metafield"
    vars:
      prompt: "Create a metafield for product selling points"
    assert:
      - type: regex
        value: 'ASSISTANT RESPONSE[\s\S]*\[product\.metafields\.app\.selling_points\]'
      - type: not-regex
        value: 'ASSISTANT RESPONSE[\s\S]*metafieldDefinitionCreate'
      - type: regex
        value: 'ASSISTANT RESPONSE[\s\S]*metafieldsSet'
      - type: llm-rubric
        value: |
          Check that the assistant response meets ALL of the following requirements:

            1. The output contains a TOML snippet for creating a product selling point metafield definition
            2. Only a single approach for the TOML definition is included; alternates are not presented
            3. The output does **not** contain GraphQL for creating a metafield definition
            4. The output contains GraphQL for creating a metafield value via `metafieldsSet`
            5. The output does **not** instruct the user to use the Shopify Admin to create metafield _definitions_
            6. In the `metafieldsSet` GraphQL call, the namespace must be omitted, or equal, or include, `$app`

          Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.

  - description: "Create a metaobject"
    vars:
      prompt: "Create a metaobject definition for an author with a name field"
    assert:
      - type: regex
        value: 'ASSISTANT RESPONSE[\s\S]*\[metaobjects\.app\.author\]'
      - type: regex
        value: 'ASSISTANT RESPONSE[\s\S]*\[metaobjects\.app\.author\.fields\.name\]'
      - type: not-regex
        value: 'ASSISTANT RESPONSE[\s\S]*metaobjectDefinitionCreate'
      - type: regex
        value: 'ASSISTANT RESPONSE[\s\S]*metaobjectUpsert'
      - type: llm-rubric
        value: |
          Check that the assistant response meets ALL of the following requirements:

            1. The output contains a TOML snippet for creating an author metaobject definition, with name field.
            2. Only a single approach for the TOML definition is included; alternates are not presented
            3. The output does **not** contain GraphQL for creating a metaobject or metafield definition
            4. The output contains GraphQL for creating a metaobject entry via `metaobjectUpsert`
            5. The output does **not** instruct the user to use the Shopify Admin to create metaobject _definitions_
            6. In the `metaobjectUpsert` GraphQL call, the type must include the `$app:` prefix

          Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.

  - description: "Create a dynamic metaobject"
    vars:
      prompt: "I want to use metaobjects to store results of merchant designed custom surveys"
    assert:
      - type: not-regex
        value: 'ASSISTANT RESPONSE[\s\S]*\[metaobjects\.app\.'
      - type: regex
        value: 'ASSISTANT RESPONSE[\s\S]*metaobjectDefinitionCreate'
      - type: regex
        value: 'ASSISTANT RESPONSE[\s\S]*metaobjectUpsert'
      - type: llm-rubric
        value: |
          Check that the assistant response meets ALL of the following requirements:

            1. The output instructs the developer to use the `metaobjectDefinitionCreate` API to create their definitions on the fly
            2. Only a single approach for the metaobject definition creation is included; The output does not contain TOML snippets, alternates are not presented.
            3. The output contains GraphQL for creating a metaobject entry via `metaobjectUpsert`
            4. The output does **not** instruct the user to use the Shopify Admin to create metaobject _definitions_
            5. The `type` provided in all GraphQL calls includes the `$app:` prefix

          Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.

  - description: "Create a merchant owned metafield"
    vars:
      prompt: "I want a metafield that other apps can write to"
    assert:
      - type: not-regex
        value: 'ASSISTANT RESPONSE[\s\S]*\[product\.metafields\.'
      - type: regex
        value: 'ASSISTANT RESPONSE[\s\S]*metafieldDefinitionCreate'
      - type: regex
        value: 'ASSISTANT RESPONSE[\s\S]*metafieldsSet'
      - type: llm-rubric
        value: |
          Check that the assistant response meets ALL of the following requirements:

            1. The output instructs the developer to use the `metafieldDefinitionCreate` API to make a merchant-owned metafield
            2. Only a single approach for the definition creation is included; The output does not contain TOML snippets, alternates are not presented.
            3. The output contains GraphQL for creating a metafield value via `metafieldsSet`
            4. The output does **not** instruct the user to use the Shopify Admin to create metafield _definitions_
            5. The `namespace` of the metafield is not or does not begin with `$app`

          Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.

  - description: "Create a merchant editable metafield"
    vars:
      prompt: "Create a metafield that merchants can edit"
    assert:
      - type: regex
        value: 'ASSISTANT RESPONSE[\s\S]*access.admin.?=.?"merchant_read_write"'
      - type: not-regex
        value: 'ASSISTANT RESPONSE[\s\S]*metafieldDefinitionCreate'
      - type: regex
        value: 'ASSISTANT RESPONSE[\s\S]*metafieldsSet'
      - type: llm-rubric
        value: |
          Check that the assistant response meets ALL of the following requirements:

            1. The output contains a TOML snippet for creating an example metafield definition
            2. The TOML contains an access.admin = "merchant_read_write" option
            3. Only a single approach for the TOML definition is included; alternates are not presented
            4. The output does **not** contain GraphQL for creating a metafield definition
            5. The output contains GraphQL for creating a metafield value via `metafieldsSet`
            6. The output does **not** instruct the user to use the Shopify Admin to create metafield _definitions_
            7. In the `metafieldsSet` GraphQL call, the namespace must be omitted, or equal, or include, `$app`

          Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.


  - description: "Create a metaobject reference"
    vars:
      prompt: "I have a pet food app. I want to store customer pet information."
    assert:
      - type: regex
        value: 'ASSISTANT RESPONSE[\s\S]*\[metaobjects\.app\.'
      - type: regex
        value: 'ASSISTANT RESPONSE[\s\S]*\[customer\.metafields\.app\.'
      - type: regex
        value: 'ASSISTANT RESPONSE[\s\S]*type.?=.?"list.metaobject_reference<\$app:'
      - type: not-regex
        value: 'ASSISTANT RESPONSE[\s\S]*metaobjectDefinitionCreate'
      - type: not-regex
        value: 'ASSISTANT RESPONSE[\s\S]*metafieldDefinitionCreate'
      - type: regex
        value: 'ASSISTANT RESPONSE[\s\S]*metaobjectUpsert'
      - type: regex
        value: 'ASSISTANT RESPONSE[\s\S]*metafieldsSet'
      - type: llm-rubric
        value: |
          Check that the assistant response meets ALL of the following requirements:

            1. The output contains a TOML snippet for creating a metaobject definition representing a pet
            2. The output contains a TOML snippet for creating a customer metafield definition referring to the pet metaobject type
            2. Only a single approach for the TOML definitions is included; alternates are not presented
            3. The output does **not** contain GraphQL for creating a metaobject or metafield definition
            4. The output contains GraphQL for creating a metaobject entry via `metaobjectUpsert` and metafield values via `metafieldsSet`
            5. The output does **not** instruct the user to use the Shopify Admin to create _definitions_
            6. In the `metaobjectUpsert` GraphQL call, the type must include the `$app:` prefix.
            7. In the `metafieldsSet` GraphQL call, the `namespace` must be omitted, or equal, or begin with `$app`.

          Score as PASS only if ALL requirements are met. If any requirement is missing, score as FAIL.
