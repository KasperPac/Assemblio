# Storefront API Agent Evaluation Configuration
description: Storefront GraphQL API Agent

prompts:
  - "I am working with the Shopify Storefront GraphQL API. {{ prompt }}"

providers:
  - id: "file://providers/shopify_dev_mcp_provider.py"
    label: "Storefront API Agent"

defaultTest:
  assert:
    - type: python
      value: file://assertions/multiline_regexp.py
    - type: python
      value: file://assertions/valid_graphql.py
    - type: contains
      value: '→ Called: learn_shopify_api with arguments: {"api":"storefront-graphql"}'

tests:
  - description: coverage test
    vars:
      prompt: Fetch an article by ID
      matches: "```graphql.*article.*```"
  - description: coverage test
    vars:
      prompt: List the latest 10 articles
      matches: "```graphql.*articles.*```"
  - description: coverage test
    vars:
      prompt: Fetch a blog by handle
      matches: "```graphql.*blog.*```"
  - description: coverage test
    vars:
      prompt: List all blogs
      matches: "```graphql.*blogs.*```"
  - description: coverage test
    vars:
      prompt: Fetch a cart by ID
      matches: "```graphql.*cart.*```"
  - description: coverage test
    vars:
      prompt: Fetch a collection by handle
      matches: "```graphql.*collection.*```"
  - description: coverage test
    vars:
      prompt: List all collections
      matches: "```graphql.*collections.*```"
  - description: coverage test
    vars:
      prompt: Fetch the logged-in customer's profile using an access token
      matches: "```graphql.*customer.*```"
  - description: coverage test
    vars:
      prompt: Fetch available countries and languages configured for the shop
      matches: "```graphql.*localization.*```"
  - description: coverage test
    vars:
      prompt:
        Find the nearest in-store pickup locations to a specified coordinate (sorted
        by distance)
      matches: "```graphql.*locations.*```"
  - description: coverage test
    vars:
      prompt: Fetch a menu by handle
      matches: "```graphql.*menu.*```"
  - description: coverage test
    vars:
      prompt: Fetch a metaobject by handle
      matches: "```graphql.*metaobject.*```"
  - description: coverage test
    vars:
      prompt:
        List the first 10 active metaobjects of a specified type (e.g., "ingredient")
        with pagination support
      matches: "```graphql.*metaobjects.*```"
  - description: coverage test
    vars:
      prompt: Fetch a node by ID
      matches: "```graphql.*node.*```"
  - description: coverage test
    vars:
      prompt: Fetch multiple nodes by IDs
      matches: "```graphql.*nodes.*```"
  - description: coverage test
    vars:
      prompt: Fetch a page by handle
      matches: "```graphql.*page.*```"
  - description: coverage test
    vars:
      prompt: List all pages
      matches: "```graphql.*pages.*```"
  - description: coverage test
    vars:
      prompt: Fetch the shop's payment settings
      matches: "```graphql.*paymentSettings.*```"
  - description: coverage test
    vars:
      prompt:
        List top 10 predictive search results for "sneakers" across products,
        collections, pages, and articles.
      matches: "```graphql.*predictiveSearch.*```"
  - description: coverage test
    vars:
      prompt: Fetch a product by handle
      matches: "```graphql.*product.*```"
  - description: coverage test
    vars:
      prompt: Fetch recommended products for a product ID
      matches: "```graphql.*productRecommendations.*```"
  - description: coverage test
    vars:
      prompt: List all product tags
      matches: "```graphql.*productTags.*```"
  - description: coverage test
    vars:
      prompt: List all product types published to your app
      matches: "```graphql.*productTypes.*```"
  - description: coverage test
    vars:
      prompt:
        List the first 20 products with cursor-based pagination (include title,
        handle, and price)
      matches: "```graphql.*products.*```"
  - description: coverage test
    vars:
      prompt:
        List all public Storefront API versions (supported, release candidate,
        and unstable)
      matches: "```graphql.*publicApiVersions.*```"
  - description: coverage test
    vars:
      prompt: List the top 10 search results for the query "running shoes"
      matches: "```graphql.*search.*```"
  - description: coverage test
    vars:
      prompt: Fetch the shop's name, primary domain, description, and currency code
      matches: "```graphql.*shop.*```"
  - description: coverage test
    vars:
      prompt:
        Fetch all sitemap URLs and last-modified timestamps for products, collections,
        pages, and articles
      matches: "```graphql.*sitemap.*```"
  - description: coverage test
    vars:
      prompt: List all URL redirects within Storefront
      matches: "```graphql.*urlRedirects.*```"
  - description: coverage test
    vars:
      prompt:
        "Update a cart\u2019s attributes to include a gift message and preferred\
        \ delivery date"
      matches: "```graphql.*cartAttributesUpdate.*```"
  - description: coverage test
    vars:
      prompt:
        "Update a cart\u2019s buyer identity with the customer\u2019s email and\
        \ shipping address to apply correct international pricing"
      matches: "```graphql.*cartBuyerIdentityUpdate.*```"
  - description: coverage test
    vars:
      prompt:
        "Create a new cart with a single line item and set the buyer\u2019s email\
        \ and country"
      matches: "```graphql.*cartCreate.*```"
  - description: coverage test
    vars:
      prompt:
        Add multiple delivery addresses to a cart so items can be shipped to different
        locations
      matches: "```graphql.*cartDeliveryAddressesAdd.*```"
  - description: coverage test
    vars:
      prompt: Remove multiple delivery addresses from a cart
      matches: "```graphql.*cartDeliveryAddressesRemove.*```"
  - description: coverage test
    vars:
      prompt:
        Replace the delivery addresses on a cart to split items across multiple
        shipping destinations
      matches: "```graphql.*cartDeliveryAddressesReplace.*```"
  - description: coverage test
    vars:
      prompt: Update the delivery addresses for multiple recipients in a cart
      matches: "```graphql.*cartDeliveryAddressesUpdate.*```"
  - description: coverage test
    vars:
      prompt:
        Apply multiple discount codes to an existing cart, replacing any previously
        applied codes
      matches: "```graphql.*cartDiscountCodesUpdate.*```"
  - description: coverage test
    vars:
      prompt:
        Apply multiple gift card codes to a customer's cart without replacing
        any existing codes
      matches: "```graphql.*cartGiftCardCodesAdd.*```"
  - description: coverage test
    vars:
      prompt: Remove all gift card codes applied to a cart
      matches: "```graphql.*cartGiftCardCodesRemove.*```"
  - description: coverage test
    vars:
      prompt:
        Update the gift card codes applied to a cart by removing old codes and
        adding new ones
      matches: "```graphql.*cartGiftCardCodesUpdate.*```"
  - description: coverage test
    vars:
      prompt:
        Add multiple merchandise lines (product variants with quantities) to an
        existing cart
      matches: "```graphql.*cartLinesAdd.*```"
  - description: coverage test
    vars:
      prompt: Remove one or more merchandise lines from a cart
      matches: "```graphql.*cartLinesRemove.*```"
  - description: coverage test
    vars:
      prompt:
        Update multiple cart lines to change quantities, swap variants, or edit
        line attributes in a cart
      matches: "```graphql.*cartLinesUpdate.*```"
  - description: coverage test
    vars:
      prompt:
        Delete a single cart metafield to remove a custom delivery instruction
        from a specific cart
      matches: "```graphql.*cartMetafieldDelete.*```"
  - description: coverage test
    vars:
      prompt:
        Set multiple cart metafields to save a gift message, delivery date, and
        referral code on the cart
      matches: "```graphql.*cartMetafieldsSet.*```"
  - description: coverage test
    vars:
      prompt:
        Update the cart note with delivery instructions (e.g., "Leave at the front
        door")
      matches: "```graphql.*cartNoteUpdate.*```"
  - description: coverage test
    vars:
      prompt:
        Update the selected delivery option to 'Express' for a specific delivery
        group in the cart
      matches: "```graphql.*cartSelectedDeliveryOptionsUpdate.*```"
  - description: coverage test
    vars:
      prompt:
        Log in a customer with email and password and return a customer access
        token for that customer
      matches: "```graphql.*customerAccessTokenCreate.*```"
  - description: coverage test
    vars:
      prompt:
        Sign in a single customer using a Multipass token and receive a customer
        access token (creating or re-enabling the customer if necessary)
      matches: "```graphql.*customerAccessTokenCreateWithMultipass.*```"
  - description: coverage test
    vars:
      prompt: Log out a customer by permanently deleting their access token
      matches: "```graphql.*customerAccessTokenDelete.*```"
  - description: coverage test
    vars:
      prompt:
        "Renew a single customer\u2019s access token before it expires to extend\
        \ their session"
      matches: "```graphql.*customerAccessTokenRenew.*```"
  - description: coverage test
    vars:
      prompt: Activate a single customer's account using their activation token
      matches: "```graphql.*customerActivate.*```"
  - description: coverage test
    vars:
      prompt: Activate a single customer's account using the activation URL from customerCreate
      matches: "```graphql.*customerActivateByUrl.*```"
  - description: coverage test
    vars:
      prompt: Add a new shipping address to a customer's account
      matches: "```graphql.*customerAddressCreate.*```"
  - description: coverage test
    vars:
      prompt: Permanently delete a single saved address from a customer's account
      matches: "```graphql.*customerAddressDelete.*```"
  - description: coverage test
    vars:
      prompt: Update a customer's saved address and set it as the default shipping address
      matches: "```graphql.*customerAddressUpdate.*```"
  - description: coverage test
    vars:
      prompt: Register a new customer account with email and password
      matches: "```graphql.*customerCreate.*```"
  - description: coverage test
    vars:
      prompt:
        Set a single customer's default address to one of their saved addresses
        using the address ID
      matches: "```graphql.*customerDefaultAddressUpdate.*```"
  - description: coverage test
    vars:
      prompt: Send a password reset email to a customer
      matches: "```graphql.*customerRecover.*```"
  - description: coverage test
    vars:
      prompt:
        Reset a single customer's password using the reset token from their password
        recovery email
      matches: "```graphql.*customerReset.*```"
  - description: coverage test
    vars:
      prompt: Reset a customer's password using the reset password URL from their email
      matches: "```graphql.*customerResetByUrl.*```"
  - description: coverage test
    vars:
      prompt: Update a single customer's email and marketing preferences
      matches: "```graphql.*customerUpdate.*```"
  - description: coverage test
    vars:
      prompt: Start a Shop Pay payment request session for the customer's current cart
      matches: "```graphql.*shopPayPaymentRequestSessionCreate.*```"
  - description: coverage test
    vars:
      prompt:
        "Submit a single Shop Pay payment request session to process the customer\u2019\
        s payment"
      matches: "```graphql.*shopPayPaymentRequestSessionSubmit.*```"
