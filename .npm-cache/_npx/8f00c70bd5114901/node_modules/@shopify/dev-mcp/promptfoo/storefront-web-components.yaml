description: Storefront Web Components API evals for an agent with access to the dev-mcp MCP server

prompts:
  - "I am using the Storefront Web Components API, help me with the following: {{ prompt }}."

providers:
  - id: "file://providers/shopify_dev_mcp_provider.py"
    label: "Dev Assistant Agent"

defaultTest:
  assert:
    - type: contains
      value: '→ Called: learn_shopify_api with arguments: {"api":"storefront-web-components"}'
    - type: python
      value: file://assertions/multiline_regexp.py
    - type: python
      value: file://assertions/valid_components.py

tests:
  - description: storefront_web_components components
    vars:
      prompt:
        How can I implement a mini cart that opens as a modal HTML dialog, where
        a product-bound button uses addLine() on click to add the item, automatically
        applies specific discount codes, and supports customized content and styling,
        using Storefront Web Components in my storefront?
      matches: (<shopify\-cart|(?:root\.)?createComponent\(shopify\-cart)
  - description: storefront_web_components components
    vars:
      prompt:
        "How can I fetch product data by handle (or gid) and render a template\
        \ only after the data loads\u2014showing a custom loading placeholder in the\
        \ meantime\u2014using Storefront Web Components? I also need to support multiple\
        \ storefronts so the context is scoped to the correct store."
      matches: (<shopify\-context|(?:root\.)?createComponent\(shopify\-context)
  - description: storefront_web_components components
    vars:
      prompt:
        How can I list the first 12 products with their title, featured image,
        price, and vendor, sorted by TITLE in descending order, and render each as a
        repeated card that automatically binds to the current product, using Storefront
        Web Components? Also, how can I switch the sorting to PRICE in ascending order
        without changing the item template?
      matches: (<shopify\-list\-context|(?:root\.)?createComponent\(shopify\-list\-context)
  - description: storefront_web_components components
    vars:
      prompt:
        "How can I display fields like product.title, product.vendor, and product.descriptionHtml\
        \ on a product page\u2014sourcing from the nearest product context and outputting\
        \ plain text that I can wrap with my own HTML\u2014using Storefront Web Components?"
      matches: (<shopify\-data|(?:root\.)?createComponent\(shopify\-data)
  - description: storefront_web_components components
    vars:
      prompt:
        How can I, using Storefront Web Components, render a responsive product
        image or video inside a product context that queries product.selectedOrFirstAvailableVariant.image
        so it automatically updates when the variant selector changes, and also configure
        sizes, breakpoints, aspect-ratio, width/height, and priority for optimized loading?
      matches: (<shopify\-media|(?:root\.)?createComponent\(shopify\-media)
  - description: storefront_web_components components
    vars:
      prompt:
        "How can I render a product price that automatically formats to the shopper\u2019\
        s market (country and language) and updates when the selected variant changes,\
        \ using Storefront Web Components in my storefront? I want to bind it to product.selectedOrFirstAvailableVariant.price\
        \ from the current context so it reacts to the variant selector."
      matches: (<shopify\-money|(?:root\.)?createComponent\(shopify\-money)
  - description: storefront_web_components components
    vars:
      prompt:
        How can I initialize my storefront with the shop domain, API version,
        and market settings (country, language, currency), and include a public access
        token so I can access inventory, metafields, and metaobjects using Storefront
        Web Components in my storefront?
      matches: (<shopify\-store|(?:root\.)?createComponent\(shopify\-store)
  - description: storefront_web_components components
    vars:
      prompt:
        How can I add a variant option form (size, color, etc.) within a product
        context so that the featured image, price, SKU, availability, and Add to Cart
        state automatically reflect the selected or first available variant using Storefront
        Web Components?
      matches: (<shopify\-variant\-selector|(?:root\.)?createComponent\(shopify\-variant\-selector)
