description: Polaris API evals for an agent with access to the dev-mcp MCP server

prompts:
  - "{{ prompt }}"

providers:
  - id: "file://providers/shopify_dev_mcp_provider.py"
    label: "Dev Assistant Agent"

defaultTest:
  assert:
    - type: contains
      value: '→ Called: learn_shopify_api with arguments: {"api":"polaris"}'

tests:
  - description: polaris web components
    vars:
      prompt: How do I use Shopify Polaris Web Components??
  - description: polaris web components migration test
    vars:
      prompt: "Update files to use Polaris Web Components:\n\napp.settings.tsx:\n{{app_settings}}\n\npackage.json:\n{{package_json}}\n\ntsconfig.json:\n{{tsconfig}}\n"
      app_settings: file://polaris_components_example_app/app.settings.tsx
      package_json: file://polaris_components_example_app/package.json
      tsconfig: file://polaris_components_example_app/tsconfig.json
    assert:
      - type: llm-rubric
        value: |
          Check ALL of the following criteria are met:
          1. The response adds <script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script> if it was missing
          2. The response adds @shopify/polaris-types dependency and updates tsconfig.json configuration
          3. The response does NOT create or reference any components starting with "p-" that don't exist in the actual Polaris Web Components library
          4. The response does NOT suggest installing npm packages that don't exist
          5. The response addresses TypeScript errors by fixing invalid components, props, or prop values
  - ./polaris/admin_extensions_polaris_web_components_tests.yaml
  - ./polaris/app_home_polaris_web_components_tests.yaml
  - ./polaris/checkout_extensions_polaris_web_components_tests.yaml
