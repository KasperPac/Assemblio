          Using the deprecated product discounts API, help me write a Shopify function which gives 10$ discount for a specific
          quantity of a product, e.g. $10 off up to 2 blue shirts.
  - description: product_discounts function in rust
    vars:
      prompt:
          Using the deprecated product discounts API, help me write a Shopify function where the user can buy 2 red shirts
          and 1 blue shirt and get the blue shirt for free.
