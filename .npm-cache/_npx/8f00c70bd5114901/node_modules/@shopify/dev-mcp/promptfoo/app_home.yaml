description: App Home evals for an agent with access to the dev-mcp MCP server

prompts:
  - "App Home: {{ prompt }}."

providers:
  - id: "file://providers/shopify_dev_mcp_provider.py"
    label: "Dev Assistant Agent"

defaultTest:
  assert:
    - type: contains
      value: '→ Called: learn_shopify_api with arguments: {"api":"polaris-app-home"}'
    - type: python
      value: file://assertions/multiline_regexp.py
    - type: python
      value: file://assertions/valid_components.py

tests:
  - ./polaris/app_home_polaris_web_components_tests.yaml
  - ./polaris/app_home_patterns_tests_with_urls.yaml
