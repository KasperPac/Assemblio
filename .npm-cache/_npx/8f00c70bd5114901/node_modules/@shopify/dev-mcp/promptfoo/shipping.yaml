# Shipping Partner Platform API Agent Evaluation Configuration
description: Shipping Partner Platform API Agent

prompts:
  - "I am working with the Shopify Shipping Partner Platform API. {{ prompt }}"

providers:
  - id: "file://providers/shopify_dev_mcp_provider.py"
    label: "Shipping Partner Platform API Agent"

defaultTest:
  assert:
    - type: python
      value: file://assertions/multiline_regexp.py
    - type: contains
      value: '→ Called: learn_shopify_api with arguments: {"api":"shipping-partner-platform"}'
    - type: python
      value: file://assertions/valid_graphql.py

tests:
  - description: coverage test
    vars:
      prompt: Fetch a shipping partner's carrier by ID
      matches: "```graphql.*appCarrier.*```"
  - description: coverage test
    vars:
      prompt: List all shipping partner carriers
      matches: "```graphql.*appCarriers.*```"
  - description: coverage test
    vars:
      prompt: Fetch a carrier by ID
      matches: "```graphql.*carrier.*```"
  - description: coverage test
    vars:
      prompt: List all shipping carriers
      matches: "```graphql.*carriers.*```"
  - description: coverage test
    vars:
      prompt: Fetch details of a pickup point location upload by ID
      matches: "```graphql.*pickupPointLocationUpload.*```"
  - description: coverage test
    vars:
      prompt: Fetch a rate card upload by ID
      matches: "```graphql.*rateCardUpload.*```"
  - description: coverage test
    vars:
      prompt: Get all shipping rates for a shipment using a specific rate card ID
      matches: "```graphql.*rates.*```"
  - description: coverage test
    vars:
      prompt: Report a failed carrier account deregistration in response to a webhook
      matches: "```graphql.*carrierAccountDeregisterFailure.*```"
  - description: coverage test
    vars:
      prompt:
        Confirm successful deregistration of a carrier account in response to
        a webhook
      matches: "```graphql.*carrierAccountDeregisterSuccess.*```"
  - description: coverage test
    vars:
      prompt:
        Use the carrierAccountRegisterFailure GraphQL mutation to handle a failed
        carrier account registration webhook callback
      matches: "```graphql.*carrierAccountRegisterFailure.*```"
  - description: coverage test
    vars:
      prompt:
        Confirm the successful registration of a single carrier account in response
        to the registration webhook
      matches: "```graphql.*carrierAccountRegisterSuccess.*```"
  - description: coverage test
    vars:
      prompt:
        Use the pickupPointLocationUploadComplete GraphQL mutation to finalize
        a pickup point location upload
      matches: "```graphql.*pickupPointLocationUploadComplete.*```"
  - description: coverage test
    vars:
      prompt:
        Start a bulk upload of pickup point locations and receive a bucket URL
        for uploading the locations file
      matches: "```graphql.*pickupPointLocationUploadInitialize.*```"
  - description: coverage test
    vars:
      prompt: Activate a single rate card by ID
      matches: "```graphql.*rateCardActivate.*```"
  - description: coverage test
    vars:
      prompt: Update a single rate card activation to set a new startsAt date and time
      matches: "```graphql.*rateCardActivationUpdate.*```"
  - description: coverage test
    vars:
      prompt: Deactivate a pending rate card activation before it becomes active
      matches: "```graphql.*rateCardDeactivate.*```"
  - description: coverage test
    vars:
      prompt: Complete a single carrier rate card upload and start processing the rates
      matches: "```graphql.*rateCardUploadComplete.*```"
  - description: coverage test
    vars:
      prompt:
        Reserve storage and retrieve a pre-signed URL to upload a single rate
        card ZIP file
      matches: "```graphql.*rateCardUploadInitialize.*```"
  - description: coverage test
    vars:
      prompt:
        Update the actual carrier charges, weight, and dimensions for a shipment
        after fulfillment
      matches: "```graphql.*shipmentActualsUpdate.*```"
  - description: coverage test
    vars:
      prompt: Report a failed shipment purchase for a single shipment with error details
      matches: "```graphql.*shipmentPurchaseFailure.*```"
  - description: coverage test
    vars:
      prompt:
        Confirm a single shipment purchase and return the shipping label and tracking
        details in response to a shipment create webhook
      matches: "```graphql.*shipmentPurchaseSuccess.*```"
  - description: coverage test
    vars:
      prompt:
        Use the shipmentVoidFailure GraphQL mutation to report a failed shipment
        void webhook callback with error details
      matches: "```graphql.*shipmentVoidFailure.*```"
  - description: coverage test
    vars:
      prompt:
        Use the shipmentVoidSuccess GraphQL mutation to confirm a successful
        shipment void webhook callback
      matches: "```graphql.*shipmentVoidSuccess.*```"
  - description: coverage test
    vars:
      prompt:
        Submit the complete tracking history for a single tracker immediately
        after subscription confirmation
      matches: "```graphql.*trackerUpdate.*```"
  - description: coverage test
    vars:
      prompt:
        "Trigger a single test webhook to the partner\u2019s endpoint to verify\
        \ the integration"
      matches: "```graphql.*webhookTrigger.*```"
