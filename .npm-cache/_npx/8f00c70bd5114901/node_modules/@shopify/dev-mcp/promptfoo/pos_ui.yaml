description: POS UI extensions API evals for an agent with access to the dev-mcp MCP server

prompts:
  - "{{ prompt }}."

providers:
  - id: "file://providers/shopify_dev_mcp_provider.py"
    label: "Dev Assistant Agent"

defaultTest:
  assert:
    - type: contains
      value: '→ Called: learn_shopify_api with arguments: {"api":"pos-ui"}'
    - type: python
      value: file://assertions/multiline_regexp.py
    - type: python
      value: file://assertions/valid_components.py

tests:
  - ./polaris/pos_ui_extensions_golden_prompts.yaml
  - ./polaris/polaris_pos_ui_extensions_polaris_web_components_tests.yaml
