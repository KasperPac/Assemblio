                  - generic [ref=e391]: Anchor to Expiring vs non-expiring offline tokens
                - text: Expiring vs non-expiring offline tokens
            - paragraph [ref=e392]:
              - text: As of December 2025, Shopify supports
              - strong [ref=e393]: expiring offline access tokens
              - text: ", providing enhanced security through token rotation with a refresh token while maintaining the ability for apps to perform background operations without user interaction."
            - heading "Anchor to Expiring offline tokens Expiring offline tokens" [level=3] [ref=e394]:
              - generic [ref=e395]:
                - link "Anchor to Expiring offline tokens" [ref=e396] [cursor=pointer]:
                  - /url: /docs/apps/build/authentication-authorization/access-tokens/offline-access-tokens#expiring-offline-tokens
                  - img [ref=e397]
                  - generic [ref=e399]: Anchor to Expiring offline tokens
                - text: Expiring offline tokens
            - paragraph [ref=e400]: "Introduced in December 2025, expiring offline tokens provide enhanced security by allowing apps to regularly rotate access tokens using refresh tokens. Apps can continue performing background operations without user interaction while maintaining better security through token expiration and app-managed token refresh. Expiring offline tokens have the following characteristics:"
            - list [ref=e401]:
              - listitem [ref=e402]:
                - strong [ref=e403]: 90-day refresh token lifetime
                - text: ": A refresh token is provided in the response when obtaining new access tokens."
              - listitem [ref=e404]:
                - strong [ref=e405]: Token refresh
                - text: ": Apps can refresh expired tokens without merchant intervention."
              - listitem [ref=e406]:
                - strong [ref=e407]: Only one expiring offline token can be active per app/shop combination
                - text: ": Acquiring a new expiring token will revoke all previous expiring tokens for that shop."
            - heading "Anchor to Non-expiring offline tokens Non-expiring offline tokens" [level=3] [ref=e408]:
              - generic [ref=e409]:
                - link "Anchor to Non-expiring offline tokens" [ref=e410] [cursor=pointer]:
                  - /url: /docs/apps/build/authentication-authorization/access-tokens/offline-access-tokens#non-expiring-offline-tokens
                  - img [ref=e411]
                  - generic [ref=e413]: Anchor to Non-expiring offline tokens
                - text: Non-expiring offline tokens
            - paragraph [ref=e414]: "Prior to December 2025, non-expiring offline tokens were the default and only option for offline access. These tokens grant permanent access to a shop's data and can only be revoked through app uninstallation or secret revocation, making them less secure than expiring tokens. Non-expiring offline tokens have the following characteristics:"
            - list [ref=e415]:
              - listitem [ref=e416]:
                - strong [ref=e417]: No expiration
                - text: ": Tokens remain valid indefinitely until app is uninstalled or secret revocation."
              - listitem [ref=e418]:
                - strong [ref=e419]: Acquiring offline tokens
                - text: ": Getting offline tokens for the same shop and installation returns the same access token each time."
            - generic [ref=e420]:
              - generic [ref=e421]:
                - img [ref=e424]
                - generic [ref=e426]: Note
              - paragraph [ref=e428]:
                - text: Apps can migrate from non-expiring to expiring tokens using the
                - link "token exchange grant" [ref=e429] [cursor=pointer]:
                  - /url: "#migrating-from-non-expiring-to-expiring-tokens"
                - text: . This is a one-time, irreversible migration per shop.
            - separator [ref=e430]
