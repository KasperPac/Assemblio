            - paragraph [ref=e382]:
              - text: When you create an API access token for the
              - link "GraphQL Admin API" [ref=e383] [cursor=pointer]:
                - /url: /docs/api/admin-graphql
              - text: ", you can choose between two access modes: offline and"
              - link "online" [ref=e384] [cursor=pointer]:
                - /url: /docs/apps/build/authentication-authorization/access-tokens/online-access-tokens
              - text: . Offline is the default access mode when none is specified. Tokens with offline access mode are meant for service-to-service requests where no user interaction is involved. Offline access mode is ideal for background work in response to webhooks, or for maintenance work in backgrounded jobs.
            - separator [ref=e385]
            - heading "Anchor to Expiring vs non-expiring offline tokens Expiring vs non-expiring offline tokens" [level=2] [ref=e386]:
              - generic [ref=e387]:
                - link "Anchor to Expiring vs non-expiring offline tokens" [ref=e388] [cursor=pointer]:
