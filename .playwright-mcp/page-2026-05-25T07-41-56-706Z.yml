                  - text: "Testing Manuva (Free to install, requires a Manuva subscription billed externally at manuva.app/pricing). PREREQUISITE: A Manuva account associated with this test store. The reviewer can sign up at https://manuva.app/signup or use the credentials provided below (if any). INSTALL FLOW 1. Install the app from the Shopify App Store install URL. Approve the OAuth consent screen (read_orders, read_products). 2. After OAuth, you'll land in the embedded Manuva surface inside Shopify Admin. EMBEDDED SURFACE 3. The embedded card shows your store domain, last sync time, and \"Sync now\" + \"Open Manuva\" buttons. 4. Click \"Sync now\" — products and orders sync from Shopify into Manuva. Wait for the sync to complete. 5. Click \"Open Manuva\" — opens app.manuva.app in a new tab where the full Manuva workspace is available. FULL WORKSPACE (app.manuva.app) 6. Sign in to Manuva using the account associated with this store. 7. Navigate to Products — synced products from Shopify appear with their variants. 8. Click any product → Variant Detail → Bill of Materials tab to see/edit the BOM. 9. Navigate to Orders — synced Shopify orders appear with allocation status. 10. Click any allocated order to see components reserved, planned margin, and labor. 11. Navigate to Components — multi-location inventory view with reorder points. 12. Navigate to Settings → Integrations → Shopify card shows Connected with per-store sync stats. DISCONNECT 13. From Settings → Integrations → Manage, click Disconnect to revoke. Or uninstall via Shopify Admin → Apps; the app/uninstalled webhook will fire and the store's access token will be removed from Manuva's database. GDPR WEBHOOKS 14. Mandatory privacy webhooks (customers/data_request, customers/redact, shop/redact) are declared in the app config and audited in Manuva's shopify_gdpr_request table. They can be triggered via Shopify CLI: shopify webhook trigger --topic customers/redact --address https://app.manuva.app/api/shopify/webhooks/gdpr/customers-redact --client-secret <secret>. NO INVENTORY WRITES Manuva is read-only on the Shopify side: it never writes back to product, variant, or inventory. The connected store's data in Shopify is never modified by Manuva. SUPPORT Email: hello@manuva.app (response within one business day)."
