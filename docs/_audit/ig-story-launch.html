<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Manuva — Live now (IG Story 1080×1920)</title>
<style>
  :root {
    --brand-1: #818CF8;
    --brand-2: #A5B4FC;
    --brand-deep: #4F46E5;
    --ink-strong: #E8ECF0;
    --ink-muted: #8496AA;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #0a0a0a;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .story {
    width: 1080px;
    height: 1920px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 80% 60% at 30% 0%, rgba(129, 140, 248, 0.35) 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 80% 100%, rgba(99, 102, 241, 0.25) 0%, transparent 55%),
      linear-gradient(180deg, #0D1117 0%, #10161F 50%, #0a0e16 100%);
    color: var(--ink-strong);
  }

  /* Subtle grid texture */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, #000 30%, transparent 80%);
  }

  /* Glowing orb */
  .orb {
    position: absolute;
    width: 900px;
    height: 900px;
    left: 50%;
    top: 38%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(129, 140, 248, 0.25) 0%, transparent 60%);
    filter: blur(40px);
    pointer-events: none;
  }

  .header {
    position: absolute;
    top: 110px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .logo img {
    height: 78px;
    width: auto;
    filter: drop-shadow(0 4px 24px rgba(129, 140, 248, 0.5));
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
    background: rgba(129, 140, 248, 0.14);
    border: 1px solid rgba(129, 140, 248, 0.35);
    border-radius: 999px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--brand-2);
    backdrop-filter: blur(8px);
  }
  .pill .dot {
    width: 12px;
    height: 12px;
    border-radius: 999px;
    background: #34D399;
    box-shadow: 0 0 16px #34D399;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.55; transform:scale(.85);} }

  .headline {
    position: absolute;
    top: 360px;
    left: 0;
    right: 0;
    text-align: center;
    padding: 0 60px;
  }
  .headline h1 {
    font-size: 124px;
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 0.94;
    background: linear-gradient(180deg, #FFFFFF 0%, #C7CEFF 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 28px;
  }
  .headline h1 em {
    font-style: normal;
    background: linear-gradient(135deg, #818CF8 0%, #A5B4FC 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .headline p {
    font-size: 32px;
    color: var(--ink-muted);
    font-weight: 400;
    letter-spacing: -0.01em;
    max-width: 820px;
    margin: 0 auto;
    line-height: 1.35;
  }
  .headline p strong {
    color: var(--brand-2);
    font-weight: 600;
  }

  /* App preview frame */
  .preview-wrap {
    position: absolute;
    bottom: 380px;
    left: 50%;
    transform: translateX(-50%);
    perspective: 2400px;
  }
  .preview {
    width: 920px;
    transform: rotateX(8deg) rotateY(-2deg);
    transform-style: preserve-3d;
    border-radius: 28px;
    overflow: hidden;
    background: #0F1117;
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow:
      0 60px 120px rgba(0,0,0,0.6),
      0 30px 60px rgba(99, 102, 241, 0.25),
      0 0 0 1px rgba(255,255,255,0.04) inset;
  }
  .preview .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 18px;
    background: linear-gradient(180deg, #1C253A, #161D2D);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .preview .titlebar .b {
    width: 12px; height: 12px; border-radius: 999px; background: rgba(255,255,255,0.18);
  }
  .preview .titlebar .b.r { background: #F87171; }
  .preview .titlebar .b.y { background: #FBBF24; }
  .preview .titlebar .b.g { background: #34D399; }
  .preview .url {
    margin-left: 16px;
    padding: 6px 14px;
    background: rgba(255,255,255,0.06);
    border-radius: 8px;
    font-size: 14px;
    color: var(--ink-muted);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }

  .preview .shot {
    display: block;
    width: 100%;
    height: auto;
  }

  /* Inline app shell (unused, kept for reference) */
  .app {
    display: grid;
    grid-template-columns: 200px 1fr;
    background: #F8F7F5;
    color: #1A1814;
    height: 540px;
  }
  .app .side {
    background: #F0EEE9;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-right: 1px solid rgba(0,0,0,0.06);
  }
  .app .side .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px 18px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    margin-bottom: 10px;
  }
  .app .side .brand .mark {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: linear-gradient(135deg, #6366F1, #4F46E5);
  }
  .app .side .brand span { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
  .app .side .lbl {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #6B6560;
    padding: 12px 10px 6px;
  }
  .app .side .item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    color: #1A1814;
  }
  .app .side .item .ic { width: 16px; height: 16px; border-radius: 4px; background: #ECEAE6; }
  .app .side .item.active { background: rgba(99, 102, 241, 0.10); color: #4338CA; }
  .app .side .item.active .ic { background: #6366F1; }

  .app .main { padding: 22px 26px; display: flex; flex-direction: column; gap: 18px; overflow: hidden; }
  .app h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .app .sub { font-size: 12px; color: #6B6560; margin-top: 2px; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .kpi {
    background: #FFFFFF; border: 1px solid rgba(0,0,0,0.06);
    border-radius: 10px; padding: 12px 14px;
  }
  .kpi .v { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .kpi .l { font-size: 11px; color: #6B6560; margin-top: 2px; }
  .kpi.brand .v { color: #4338CA; }

  .row2 { display: grid; grid-template-columns: 1.5fr 1fr; gap: 12px; flex: 1; min-height: 0; }
  .panel {
    background: #FFFFFF; border: 1px solid rgba(0,0,0,0.06);
    border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .panel h3 { font-size: 13px; font-weight: 600; }

  .chart { flex: 1; display: flex; align-items: flex-end; gap: 8px; padding-top: 6px; }
  .bar { flex: 1; background: linear-gradient(180deg, #818CF8, #6366F1); border-radius: 4px 4px 0 0; opacity: 0.9; }
  .bar.alt { background: linear-gradient(180deg, #C7CEFF, #A5B4FC); }

  .alerts { display: flex; flex-direction: column; gap: 8px; }
  .alert {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px;
    background: rgba(217, 119, 6, 0.08);
    border: 1px solid rgba(217, 119, 6, 0.18);
    border-radius: 8px;
  }
  .alert .icon { width: 18px; height: 18px; border-radius: 999px; background: #D97706; flex: none; }
  .alert .t { font-size: 12px; font-weight: 600; }
  .alert .d { font-size: 11px; color: #6B6560; margin-top: 2px; }

  /* Integrations strip */
  .integrations {
    position: absolute;
    bottom: 200px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  .integrations .label {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .integrations .row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    padding: 0 50px;
  }
  .integrations .row img {
    height: 56px;
    width: auto;
    max-width: 130px;
    filter: brightness(0) invert(1);
    opacity: 0.85;
    object-fit: contain;
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 90px;
    left: 0;
    right: 0;
    text-align: center;
  }
  .footer .domain {
    display: block;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -0.01em;
    background: linear-gradient(135deg, #FFFFFF 0%, #C7CEFF 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .footer .tag {
    display: block;
    margin-top: 14px;
    font-size: 20px;
    color: var(--ink-muted);
    letter-spacing: 0.04em;
  }

  /* Sparkles */
  .spark { position: absolute; width: 6px; height: 6px; border-radius: 999px; background: #fff; box-shadow: 0 0 12px #fff; }
  .s1 { top: 280px; left: 130px; opacity: .6; }
  .s2 { top: 420px; right: 160px; width: 4px; height: 4px; opacity: .5; }
  .s3 { top: 920px; left: 90px; width: 8px; height: 8px; opacity: .4; }
  .s4 { top: 1640px; right: 110px; opacity: .5; }
</style>
</head>
<body>
  <div class="story">
    <div class="grid"></div>
    <div class="orb"></div>

    <span class="spark s1"></span>
    <span class="spark s2"></span>
    <span class="spark s3"></span>
    <span class="spark s4"></span>

    <div class="header">
      <div class="logo">
        <img src="../../public/manuva-logo.png" alt="Manuva" />
      </div>
      <div class="pill"><span class="dot"></span> Now live</div>
    </div>

    <div class="headline">
      <h1>Manufacturing,<br/><em>finally simple.</em></h1>
      <p>Inventory, BOMs, orders, purchasing <strong>and finance</strong> — all in one workspace.</p>
    </div>

    <div class="preview-wrap">
      <div class="preview">
        <div class="titlebar">
          <span class="b r"></span><span class="b y"></span><span class="b g"></span>
          <span class="url">manuva.app/app</span>
        </div>
        <img class="shot" src="Screenshot 2026-05-13 103212.png" alt="Manuva dashboard" />
      </div>
    </div>

    <div class="integrations">
      <span class="label">Plays nicely with</span>
      <div class="row">
        <img src="logos/shopify.svg" alt="Shopify" />
        <img src="logos/amazon.svg" alt="Amazon" />
        <img src="logos/etsy.svg" alt="Etsy" />
        <img src="logos/woocommerce.svg" alt="WooCommerce" />
        <img src="logos/xero.svg" alt="Xero" />
        <img src="logos/myob.svg" alt="MYOB" />
        <img src="logos/quickbooks.svg" alt="QuickBooks" />
      </div>
    </div>

    <div class="footer">
      <span class="domain">manuva.app</span>
      <span class="tag">Built for modern manufacturers.</span>
    </div>
  </div>
</body>
</html>
